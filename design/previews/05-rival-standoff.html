<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat RPG — Frame 05: Rival Standoff (mock screenshot)</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  body { margin: 0; background: #111; }
  /* Standoff name-card (shared design with frame 02's identity ribbon): Sage wedge band, Ink frame,
   * chestnut portrait, Wall Sitters brick emblem, Title stamp. UI rounded face only (art bible §7.4, §7.5). */
  #card { left: 36px; top: 40px; }
  .sc-wrap { position: relative; filter: drop-shadow(3px 4px 0 rgba(110,106,168,.55)); padding-left: 70px; }
  .sc { display: flex; align-items: center; gap: 16px; height: 112px; padding: 0 110px 0 84px; background: var(--sage); border: 4px solid var(--ink); border-right: 0;
        clip-path: polygon(0 0, 100% 0, calc(100% - 48px) 100%, 0 100%); color: var(--ink); }
  .sc .nm { font: 800 52px/1 var(--font); letter-spacing: .02em; }
  .sc .tt { font: 700 28px/1 var(--font); margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .sc-portrait { position: absolute; left: 0; top: -14px; }
  .sc-stamp { position: absolute; right: 62px; top: 50%; transform: translateY(-50%) rotate(-8deg); }
  #bark { left: 1000px; top: 70px; }
  #bark .k-bubble { --tail-x: 60px; max-width: 720px; font-size: 34px; padding: 38px 44px 28px; }
</style>
</head>
<body>
<div class="k-stage" id="stage"></div>
<script src="kit/kit.js"></script>
<script src="rival-helpers.js"></script>
<script>
/* FRAME 05 — RIVAL STANDOFF (the Cinematic Standoff push-in, camera §3.7; art bible §10.5).
 * Hidamari Lane at Dusk. Mikan (left, keeps the line of action) and Togemaru, the First Thorn and the Lane's Nemesis,
 * meet broadside on the High Road: both arched, a speed-line band behind each (Magenta behind the Nemesis), a hard
 * light wedge of low sun between them, the scene outside the two cats dimmed 15%. Rival face >= 25% of screen height.
 * HUD hidden during the cinematic; the name-card slams into the upper third. */
const K = Kit, C = K.C, W = 1920, H = 1080, HZ = 600;
const s = [];

/* ---------- Dusk sky, the sun sitting on the sea between the two cats ---------- */
s.push(K.sky({ w: W, h: 700, phase: 'dusk', zenith: '#5A4EA2', horizon: '#FFA552' }));
s.push(K.glow(840, 580, 1300, 520, '#FFBE70', 0.65));
s.push(K.cloud({ x: 260, y: 640, w: 700, h: 420, seed: 7, shade: '#A874A2', light: '#FFD2A6' }));
s.push(K.cloud({ x: 1700, y: 650, w: 760, h: 520, seed: 3, shade: '#A874A2', light: '#FFD6AC' }));
s.push(`<g opacity="0.6" filter="url(#k-soft)"><path d="M520 300Q700 286 900 296" stroke="#FFD2B0" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M980 380Q1120 370 1300 378" stroke="#FFC8A0" stroke-width="5" fill="none" stroke-linecap="round"/></g>`);
s.push(RV.duskSea({ x: 0, y: HZ - 4, w: W, h: 80, sunX: 840 }));
s.push(RV.sun({ x: 840, y: HZ - 18, r: 50 }));
// headlands
s.push(K.hill({ pts: [[-20, 604], [120, 570], [300, 556], [460, 574], [560, 600]], baseY: 700, color: '#6E5C98', seed: 9 }));
s.push(K.hill({ pts: [[1180, 604], [1320, 566], [1500, 540], [1700, 530], [1940, 548]], baseY: 700, color: '#6E5C98', seed: 5 }));

/* ---------- the town below the wall: roofs in violet shade, sunlit ridges, warm windows ---------- */
s.push(`<rect x="0" y="660" width="${W}" height="${H - 660}" fill="#5C4E80"/>`);
const ridge = (x0, x1, y, h, c) => K.roof({ quad: [[x0 + 30, y], [x1 - 30, y], [x1, y + h], [x0, y + h]], rows: 3, cols: Math.round((x1 - x0) / 40), color: c || '#5A5088' }) + `<path d="M${x0 + 30} ${y}H${x1 - 30}V${y + 5}H${x0 + 30}Z" fill="#FFC27E"/>`;
s.push(ridge(-40, 420, 640, 70, '#52487E') + ridge(380, 760, 660, 60) + ridge(1080, 1500, 650, 64, '#52487E') + ridge(1460, 1960, 636, 72));
s.push(`<g filter="url(#k-rough)">${[[60, 724], [210, 730], [470, 736], [1150, 730], [1560, 724], [1760, 730]].map(([x, y]) => `<rect x="${x}" y="${y}" width="54" height="34" fill="#FFD27E"/><path d="M${x + 27} ${y}V${y + 34}" stroke="#6E4A64" stroke-width="4"/>`).join('')}</g>`);
s.push(K.pole({ x: 1880, y: 860, h: 860, w: 36 }) + K.wires({ pts: [[-20, 150], [1880, 70]], sag: 120, width: 2.5, color: '#3E3258' }) + K.wires({ pts: [[-20, 200], [1880, 110]], sag: 130, width: 2, color: '#3E3258' }));

/* ---------- the High Road: the wall top as a lit stage across the frame ---------- */
s.push(K.surface({ pts: [[-20, 900], [W + 20, 900], [W + 20, H + 20], [-20, H + 20]], color: '#5C4676', grime: 0.2 })); // wall face, in shade
s.push(K.wall({ quad: [[-20, 858], [W + 20, 858], [W + 20, 904], [-20, 904]], color: '#F2CDA6', top: '#FFE2B8', bottom: '#E3B08C', grime: 0.05, copingH: 0, base: false }));
s.push(`<path d="M-20 856H${W + 20}V864H-20Z" fill="#FFF0C8"/>`);
s.push(K.castShadow(`M-20 904H${W + 20}V960H-20Z`, 0.45));
// dark foreground bushes framing the stage
s.push(K.foliage({ x: 90, y: 1040, w: 520, h: 230, seed: 71, tones: { dark: '#24343E', mid: '#33504A', light: '#56714C', hi: '#C08E5E' } }));
s.push(K.foliage({ x: 1700, y: 1050, w: 560, h: 240, seed: 75, tones: { dark: '#24343E', mid: '#33504A', light: '#56714C', hi: '#C08E5E' } }));

/* ---------- dim 15% outside the two cats ---------- */
s.push(`<radialGradient id="dimg" cx="0.47" cy="0.62" r="0.62"><stop offset="0.45" stop-color="#3E2E66" stop-opacity="0"/><stop offset="1" stop-color="#3E2E66" stop-opacity="0.5"/></radialGradient><rect width="${W}" height="${H}" fill="#3E2E66" opacity="0.15" style="mix-blend-mode:multiply"/><rect width="${W}" height="${H}" fill="url(#dimg)" style="mix-blend-mode:multiply"/>`);

/* ---------- Standoff bands: Bell-Gold behind Mikan, Frazzle Magenta behind the Nemesis ---------- */
const band = (x, y, w, h, fill, line, seed, skew) => { const d = `M${x + skew} ${y}H${x + w + skew - 60}L${x + w + skew} ${y + h * 0.5}L${x + w - 40} ${y + h}H${x - 30}L${x + 40} ${y + h * 0.5}Z`;
  return `<path d="${d}" fill="${fill}" fill-opacity="0.9" stroke="${C.ink}" stroke-width="3"/>` + `<g>${K.clipTo(d, K.speedLines({ mode: 'parallel', x: x - 20, y: y + 4, w: w + 80, h: h - 8, angle: 0, count: 17, color: line, seed }))}</g>`; };
s.push(band(-80, 590, 820, 220, C.gold, C.cream, 3, 30));
s.push(band(1010, 400, 900, 360, C.magenta, C.cream, 7, -40));

/* ---------- the followers: two Toughs on a ridge behind Togemaru (outside the light: dimmed) ---------- */
s.push(`<g style="filter:brightness(0.78) saturate(0.85)">` + K.cat({ ...RV.CAST.kuri, pose: 'front-sit', expr: 'angry', outline: 'sage', x: 1770, y: 650, scale: 1.2 }));
s.push(K.cat({ ...RV.CAST.sasa, pose: 'front-sit', expr: 'smug', outline: 'sage', x: 1880, y: 642, scale: 1.15, flip: true }) + '</g>');

/* ---------- the hard light wedge between them ---------- */
s.push(`<path d="M812 0H870L990 858H700Z" fill="#FFF0C4" opacity="0.55"/><path d="M832 0H850L900 858H790Z" fill="#FFFBE6" opacity="0.6"/>`);
s.push(`<path d="M690 858H1000L1040 904H650Z" fill="#FFF6D6" opacity="0.8"/>`);

/* ---------- Mikan: arched, broadside, facing right (line of action kept: Mikan left) ---------- */
const mk = { x: 420, y: 878, sc: 2.9 };
s.push(K.shadow({ x: mk.x, y: mk.y, rx: 170, ry: 12, opacity: 0.5 }));
s.push(K.glow(mk.x + 60, mk.y - 170, 260, 200, '#FFE2A8', 0.35));
s.push(K.cat({ ...K.CAST.mikan, pose: 'hiss', expr: 'hiss', outline: 'gold', x: mk.x, y: mk.y, scale: mk.sc, shadow: false }));
s.push(K.ticks({ x: mk.x + 20, y: mk.y - 200, r: 150, n: 3, a0: -130, a1: -60, len: 20 }));

/* ---------- Togemaru: arched, broadside, hackles up, torn ear; face >= 25% of the frame ---------- */
const tg = { x: 1400, y: 892, sc: 5.1 };
const ear = { x: tg.x - 29.5 * tg.sc, y: tg.y - 81 * tg.sc };
s.push(K.shadow({ x: tg.x - 30, y: tg.y, rx: 330, ry: 16, opacity: 0.5 }));
s.push(K.glow(tg.x - 150, tg.y - 330, 380, 300, '#FFC98A', 0.5)); // low-sun rim behind the black coat
s.push(RV.notched(K.cat({ ...RV.CAST.togemaru, pose: 'hiss', expr: 'hiss', outline: 'sage', x: tg.x, y: tg.y, scale: tg.sc, flip: true, shadow: false }),
  [{ x: ear.x - 6, y: ear.y - 4, a: 52, d: 25, w: 17 }], { rim: C.sage, lw: 3 }));
s.push(RV.storm({ x: tg.x - 170, y: tg.y - 560, s: 1.7 }));
s.push(K.ticks({ x: tg.x - 210, y: tg.y - 330, r: 190, n: 3, a0: 190, a1: 240, len: 26, lw: 3.5 }));

/* ---------- grade ---------- */
s.push(`<rect width="${W}" height="${H}" fill="#FFB070" opacity="0.06" style="mix-blend-mode:multiply"/>`);

/* ---------- UI ---------- */
const ink = C.ink;
const brick = `<svg width="46" height="34" viewBox="-24 -17 48 34"><path d="M-21 -14h42v28h-42z" fill="${C.cream}" stroke="${ink}" stroke-width="3"/><path d="M-21 0h42M0 -14v14M-10 0v14M11 0v14" stroke="${ink}" stroke-width="3" fill="none"/></svg>`;
const claw = (on) => `<svg width="22" height="30" viewBox="-11 -15 22 30"><path d="M-5 12L2 -12" stroke="${ink}" stroke-width="${on ? 5 : 3}" stroke-linecap="round" opacity="${on ? 1 : 0.35}"/></svg>`;
const titleStamp = RV.stamp(RV.GLYPH.bell + `<path d="M-16 -16L16 16" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`, { size: 80, color: C.cream });
const portrait = K.ui.portrait({ size: 144, ring: ink, bg: '#F7C99A', cat: { ...RV.CAST.togemaru, expr: 'angry', outline: 'ink' } });
document.getElementById('stage').innerHTML = K.svg(W, H, s.join(''), 'class="k-world"') + `
  <div class="k-abs" id="card"><div class="sc-wrap"><div class="sc">${brick}
      <div><div class="nm">TOGEMARU</div><div class="tt">the First Thorn · Bell-Ringer ${claw(true)}${claw(false)}${claw(false)}</div></div></div>
    <div class="sc-portrait">${portrait}</div><div class="sc-stamp">${titleStamp}</div></div></div>
  <div class="k-abs" id="bark"><div class="k-bubble"><span class="k-ribbon k-ribbon--sage">Togemaru</span>You notched my ear at Laundry Pole Yard. Round two, Collar.</div></div>`;
</script>
</body>
</html>
