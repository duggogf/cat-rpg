<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat RPG — Frame 01: Exploration (mock screenshot)</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  body { margin: 0; background: #111; }
  /* HUD placement only; component looks come from kit.css */
  #dial { right: 44px; top: 36px; }
  #prompt-spray { left: 1188px; top: 296px; }
  #prompt-home { left: 786px; top: 606px; }
</style>
</head>
<body>
<div class="k-stage" id="stage"></div>
<script src="kit/kit.js"></script>
<script>
/* FRAME 01 — EXPLORATION. Hidamari Lane, late Day. Third-person camera 2.2 m behind Mikan, ~1 m up.
 * Perspective: horizon y=330, focal 1304 px, camera height 1 m, lane centre x=900.
 *   ground y at distance d (m):  330 + 1304/d      screen x of a point X m right of centre: 900 + X*1304/d */
const K = Kit, C = K.C, W = 1920, H = 1080, HZ = 330, F = 1304, CX = 900;
const P = (X, Y, d) => [CX + X * F / d, HZ + (1 - Y) * F / d];   // world (X right, Y up, d away) -> screen
const s = [];

/* ---------- sky, cumulus, sea, far hill ---------- */
s.push(K.sky({ w: W, h: 470, phase: 'day' }));
s.push(K.glow(200, 0, 1000, 520, '#FFF6D8', 0.6));
s.push(K.cloud({ x: 330, y: 345, w: 560, h: 250, seed: 12, opacity: 0.96 }));
s.push(K.cloud({ x: 1420, y: 350, w: 800, h: 440, seed: 3 }));
s.push(K.cloud({ x: 960, y: 344, w: 380, h: 170, seed: 21, opacity: 0.95 }));

s.push(K.sea({ x: 560, y: HZ, w: 800, h: 90 }));
s.push(`<rect x="560" y="${HZ - 5}" width="800" height="12" fill="#DDF1FA" opacity="0.7" filter="url(#k-soft)"/>`);
s.push(K.hill({ pts: [[1030, 334], [1110, 322], [1210, 296], [1340, 262], [1500, 226], [1700, 204], [1930, 176]], baseY: 430, color: '#6DAE95', seed: 5 }));
s.push(K.hill({ pts: [[640, 334], [700, 324], [760, 320], [830, 328], [880, 334]], baseY: 340, color: '#8CC0C4', seed: 9 }));

/* ---------- the lower town beyond the crest: roofs stepping down to the sea ---------- */
const farRoof = (x, y, w, h, c) => K.roof({ quad: [[x + w * 0.12, y], [x + w * 0.88, y], [x + w, y + h], [x, y + h]], rows: 3, cols: 7, color: c || '#7E93A8' }) + `<rect x="${x + w * 0.06}" y="${y + h}" width="${w * 0.88}" height="${h * 0.9}" fill="#EFE3C8"/>`;
s.push(farRoof(730, 352, 120, 22) + farRoof(876, 360, 150, 26, '#8799AC') + farRoof(1010, 350, 130, 24) + farRoof(800, 376, 170, 30, '#74889E') + farRoof(980, 384, 160, 30));
s.push(K.foliage({ x: 870, y: 372, w: 70, h: 34, seed: 31, far: true }) + K.foliage({ x: 1000, y: 398, w: 110, h: 40, seed: 32, far: true }) + K.foliage({ x: 760, y: 398, w: 90, h: 40, seed: 33, far: true }));
s.push(`<rect x="700" y="340" width="480" height="90" fill="#CDE6F2" opacity="0.38"/>`);

/* ---------- right: hill trees, the house behind the fence, laundry ---------- */
s.push(K.foliage({ x: 1520, y: 200, w: 520, h: 260, seed: 41, far: true, tones: { dark: '#3F8463', mid: '#5E9F6A', light: '#93C77A' } }));
s.push(K.foliage({ x: 1850, y: 150, w: 360, h: 330, seed: 43, tones: { dark: '#2F6E4A', mid: '#4F964C', light: '#86C25A', hi: '#C4E07E' } }));
// house: gable wall + big tiled roof (d ~ 11-17 m, X 2.6..9 m)
s.push(K.surface({ pts: [[1240, 190], [1760, 150], [1760, 330], [1240, 336]], color: '#EFDDBB', grime: 0.2 }));
s.push(K.surface({ pts: [[1240, 268], [1760, 250], [1760, 330], [1240, 336]], color: '#B98552', grime: 0.1, tex: 'brush-v', texOpacity: 0.3 }));
s.push(`<g filter="url(#k-rough)"><rect x="1340" y="204" width="150" height="62" fill="#5E7F9A"/><rect x="1340" y="204" width="150" height="62" fill="none" stroke="#8A5A36" stroke-width="7"/><path d="M1415 204V266M1340 234H1490" stroke="#8A5A36" stroke-width="5"/><path d="M1346 210L1400 210L1352 260Z" fill="#CFE6F2" opacity="0.55"/><rect x="1560" y="200" width="120" height="60" fill="#6B8BA4"/><rect x="1560" y="200" width="120" height="60" fill="none" stroke="#8A5A36" stroke-width="7"/><path d="M1620 200V260" stroke="#8A5A36" stroke-width="5"/></g>`);
s.push(K.roof({ quad: [[1250, 48], [1800, 10], [1860, 168], [1190, 204]], rows: 8, cols: 22 }));
s.push(K.castShadow('M1190 204L1860 168L1860 196L1196 232Z', 0.42));
// laundry pole and sheets, catching the sun
s.push(`<g filter="url(#k-rough)"><path d="M1168 300V168M1420 296V160" stroke="#9A8A78" stroke-width="7"/><path d="M1160 176L1428 168" stroke="#B9A894" stroke-width="5"/>
  <path d="M1186 178L1262 176L1266 268L1190 272Z" fill="#FFFDF4"/><path d="M1246 177L1262 176L1266 268L1250 269Z" fill="#D9D6EC"/>
  <path d="M1278 176L1330 174L1332 240L1280 244Z" fill="#F7D9A8"/><path d="M1318 175L1330 174L1332 240L1320 241Z" fill="#D9B88E"/>
  <path d="M1346 174L1408 171L1410 262L1350 266Z" fill="#FFFDF4"/><path d="M1394 172L1408 171L1410 262L1396 263Z" fill="#D9D6EC"/></g>`);

/* ---------- left: the garden tree behind the wall ---------- */
s.push(`<path d="M250 420C240 300 290 220 270 90L330 80C330 210 300 300 330 420Z" fill="#7A5A44" filter="url(#k-rough)"/><path d="M250 420C240 300 290 220 270 90L290 88C300 220 260 300 272 420Z" fill="#A27E5E" filter="url(#k-rough)"/>`);
s.push(K.foliage({ x: 560, y: 150, w: 420, h: 250, seed: 52, far: true, tones: { dark: '#3F8463', mid: '#5E9F6A', light: '#93C77A' } }));
s.push(K.foliage({ x: 120, y: 40, w: 640, h: 330, seed: 51 }));
s.push(K.foliage({ x: 470, y: 120, w: 400, h: 230, seed: 53 }));
s.push(K.foliage({ x: 650, y: 235, w: 240, h: 130, seed: 55, tones: { dark: '#2F6E4A', mid: '#4C8F4A', light: '#7DB857', hi: '#B5D873' } }));

/* ---------- the lane ---------- */
s.push(K.ground({ pts: [[-10, 398], [W + 10, 398], [W + 10, H + 10], [-10, H + 10]], seed: 4 }));
// worn, sunlit centre track + crest lip
s.push(`<path d="M790 404L1010 404L1500 1090L330 1090Z" fill="#FFF1CF" opacity="0.34" filter="url(#k-soft2)"/>`);
s.push(`<rect x="700" y="394" width="460" height="9" fill="#F6ECD2" opacity="0.9" filter="url(#k-rough)"/>`);

s.push(`<g filter="url(#k-rough)" fill="none" stroke="#9A8C78" stroke-width="2.5" opacity="0.55"><path d="M1030 520l40 26l-12 40l52 60"/><path d="M1240 800l70 30l30 70"/><path d="M930 440l18 14l-6 16"/></g>`);
s.push(`<path d="M${P(1.6, 0, 10)[0]} ${P(1.6, 0, 10)[1]}L${P(1.6, 0, 1.6)[0]} ${P(1.6, 0, 1.6)[1]}L${P(1.25, 0, 1.6)[0]} ${P(1.25, 0, 1.6)[1]}L${P(1.3, 0, 10)[0]} ${P(1.3, 0, 10)[1]}Z" fill="#D9CDB4" opacity="0.8" filter="url(#k-rough)"/>`);

s.push(`<path d="M790 404L1010 404L1260 760L620 760Z" fill="#FFF4D6" opacity="0.3" filter="url(#k-soft)"/>`);

/* ---------- left plaster wall (in shade; its lit coping is the High Road ribbon) ---------- */
const wallQ = [[-200, -13], [770, 289], [770, 411.5], [-200, 1018]];
const wp = (Y, d) => P(-1.6, Y, d);
const quadW = (y0, y1, d0, d1) => 'M' + [wp(y1, d0), wp(y1, d1), wp(y0, d1), wp(y0, d0)].map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
let scrib = ''; for (let i = 0; i < 5; i++) { const y = 1.06 - i * 0.085, a = wp(y, 5.42), b = wp(y, 5.42 + 0.5 + (i % 2) * 0.22); scrib += `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}Q${((a[0] + b[0]) / 2).toFixed(1)} ${((a[1] + b[1]) / 2 - 3).toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}" stroke="#7A6E86" stroke-width="2.4" fill="none" stroke-dasharray="${9 + i * 2} 4 ${5 + i} 3" opacity="0.7"/>`; }
const wallArt = `
  <path d="${quadW(0.0, 1.5, 2.0, 2.9)}" fill="#F3E2C4" opacity="0.5" filter="url(#k-soft2)"/>
  <path d="${quadW(0.5, 1.2, 7.4, 9.6)}" fill="#EFE1CC" opacity="0.6" filter="url(#k-soft)"/>
  <path d="${quadW(0.2, 0.9, 3.3, 3.9)}" fill="#C6B8C0" opacity="0.5" filter="url(#k-soft)"/>
  <path d="${quadW(0.55, 1.18, 5.3, 6.35)}" fill="#EFE7D2"/><path d="${quadW(1.08, 1.18, 5.3, 6.35)}" fill="#7E93B6" opacity="0.85"/>${scrib}
  <path d="M${wp(1.42, 4.1)[0]} ${wp(1.42, 4.1)[1]}l14 46l-10 38l16 50" stroke="#9A8C9C" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M${wp(1.4, 11)[0]} ${wp(1.4, 11)[1]}l6 22l-5 18" stroke="#9A8C9C" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="${quadW(0.0, 0.22, 1.5, 16)}" fill="#6F9A5E" opacity="0.28" filter="url(#k-soft)"/>`;
s.push(K.wall({ quad: wallQ, color: '#E4D6CB', top: '#D5CCDB', bottom: '#F1DDB9', grime: 0.3, copingH: 0.075, inner: wallArt }));
s.push(K.glow(480, 600, 480, 170, '#FFE9B8', 0.4)); // warm bounce from the lane
s.push(`<path d="M${P(-1.6, 0, 16)[0]} ${P(-1.6, 0, 16)[1]}L${P(-1.6, 0, 1.4)[0]} ${P(-1.6, 0, 1.4)[1]}L${P(-1.48, 0, 1.4)[0]} ${P(-1.48, 0, 1.4)[1]}L${P(-1.52, 0, 16)[0]} ${P(-1.52, 0, 16)[1]}Z" fill="#8C7F88" opacity="0.55" filter="url(#k-rough)"/>`);
s.push(K.surface({ pts: [[770, 280], [800, 286], [800, 408], [770, 411.5]], color: '#F6E9CC', grime: 0.1 })); // the wall's sunlit end face

/* ---------- right: board fence, hedge, utility pole ---------- */
const fTop = (d) => P(1.6, 1.3, d), fBot = (d) => P(1.6, 0, d);
s.push(K.foliage({ x: 1078, y: 372, w: 130, h: 70, seed: 61, tones: { dark: '#2F6E4A', mid: '#4C8F4A', light: '#7DB857', hi: '#B5D873' } }));
s.push(K.fence({ quad: [fTop(2.0), fTop(10), fBot(10), fBot(2.0)].map((p, i) => i === 0 || i === 3 ? p : p), n: 26, seed: 5 }));
s.push(K.pole({ x: P(1.45, 0, 7.4)[0], y: P(1.45, 0, 7.4)[1], h: 620, w: 44 }));
s.push(K.wires({ pts: [[1190, -10], [600, 150]], sag: 46, width: 2.5 }) + K.wires({ pts: [[1230, -10], [540, 120]], sag: 60, width: 2 }) + K.wires({ pts: [[1210, 30], [1920, 110]], sag: 30, width: 2.5 }));

/* ---------- coloured shadows on the lane (wisteria, never grey) ---------- */
const shEdge = (d) => P(-0.62, 0, d);
let leaf = ''; const R = K.rng(77);
for (let i = 0; i < 90; i++) { const d = 1.5 + Math.pow(R(), 1.5) * 13, p = P(-0.66 + (R() - 0.3) * 0.34, 0, d), r = (0.05 + R() * 0.1) * F / d; leaf += `<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r * 0.42).toFixed(1)}" transform="rotate(${Math.round(R() * 50 - 25)} ${p[0].toFixed(1)} ${p[1].toFixed(1)})"/>`; }
s.push(`<g fill="#7F7CCF" opacity="0.46" style="mix-blend-mode:multiply"><path d="M770 411.5L${shEdge(16)[0]} 411.5L${shEdge(5)[0]} ${shEdge(5)[1]}L${shEdge(1.5)[0]} ${shEdge(1.5)[1]}L-200 1200L-200 1018Z"/><g filter="url(#k-dab)">${leaf}</g></g>`);
// dappled sun inside the shadow
let dap = ''; for (let i = 0; i < 9; i++) { const d = 2.0 + R() * 6, p = P(-1.4 + R() * 0.55, 0, d), r = (0.05 + R() * 0.07) * F / d; dap += `<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r * 0.36).toFixed(1)}"/>`; }
s.push(`<g fill="#FFF3CF" opacity="0.5" filter="url(#k-leaf-fine)">${dap}</g>`);
s.push(K.castShadow(`M${P(1.6, 0, 2)[0]} ${P(1.6, 0, 2)[1]}L${P(1.6, 0, 10)[0]} ${P(1.6, 0, 10)[1]}L${P(1.9, 0, 10)[0]} ${P(1.9, 0, 10)[1]}L${P(2.1, 0, 2)[0]} ${P(2.1, 0, 2)[1]}Z`, 0.3));
const pb = P(1.45, 0, 7.4); s.push(K.castShadow(`M${pb[0] - 20} ${pb[1]}L${pb[0] + 22} ${pb[1]}L${pb[0] + 330} ${pb[1] + 46}L${pb[0] + 300} ${pb[1] + 60}Z`, 0.34));

/* ---------- planting: spill-over greenery, hydrangeas, grass ---------- */
s.push(K.foliage({ x: 130, y: 170, w: 420, h: 220, seed: 57 }));
s.push(K.foliage({ x: 20, y: 330, w: 260, h: 260, seed: 58, tones: { dark: '#2A6245', mid: '#4C8F4A', light: '#7DB857', hi: '#B5D873' } }));
s.push(K.foliage({ x: 640, y: 292, w: 150, h: 80, seed: 59 }));
s.push(K.castShadow('M180 250Q300 330 420 300Q380 400 250 400Q170 360 180 250Z', 0.22));
s.push(K.foliage({ x: 300, y: 228, w: 250, h: 150, seed: 60 }));
s.push(K.flowers({ x: P(1.42, 0, 5.2)[0], y: P(1.42, 0.22, 5.2)[1], w: 210, h: 92, seed: 6 }));
s.push(K.flowers({ x: P(1.45, 0, 8.6)[0], y: P(1.45, 0.2, 8.6)[1], w: 120, h: 54, seed: 9, n: 5 }));
s.push(K.grass({ x1: 770, y1: 412, x2: 240, y2: 742, n: 30, h: 26, seed: 5, scaleAt: (t) => 0.5 + t * 1.3 }));
s.push(K.grass({ x1: 240, y1: 742, x2: -40, y2: 920, n: 16, h: 46, seed: 8, scaleAt: (t) => 1.2 + t }));
s.push(K.grass({ x1: fBot(10)[0], y1: fBot(10)[1], x2: fBot(3.2)[0], y2: fBot(3.2)[1], n: 26, h: 22, seed: 12, scaleAt: (t) => 0.5 + t * 1.2 }));
s.push(K.prop({ kind: 'pot', x: P(1.36, 0, 3.7)[0], y: P(1.36, 0, 3.7)[1] + 4, scale: 1.9 }));
s.push(K.prop({ kind: 'bucket', x: P(1.3, 0, 4.4)[0] - 40, y: P(1.3, 0, 4.4)[1] + 2, scale: 1.25 }));

/* ---------- the pull home: Head Home thread, a bell-gold scent ribbon up onto the High Road ---------- */
const cop = (d, w) => { const p = P(-1.6, 1.5, d); return [p[0] + 6, p[1] - 9 + w]; };
const tp = []; for (let i = 0; i <= 14; i++) { const d = 16 - i * 0.93; tp.push(cop(d, Math.sin(i * 1.15) * (1.5 + i * 0.8))); }
s.push(K.ribbon({ pts: [[794, 332], [801, 308], [786, 292], ...tp], width: 13, rimW: 3, taper: true, ink: true, grow: (t) => 0.4 + t * 0.9 }));

/* ---------- rival on the wall top ---------- */
const rv = { x: 452, y: 190 };
s.push(K.cat({ ...K.CAST.braggart, pose: 'front-sit', expr: 'smug', x: rv.x, y: rv.y, scale: 1.12, flip: false }));

/* ---------- the Scent Post: stone lantern, two sage wisps (held by the Wall Sitters, below Strong) ---------- */
const lp = P(0.6, 0, 4.2);
s.push(K.castShadow(`M${lp[0] - 30} ${lp[1] - 4}L${lp[0] + 40} ${lp[1] - 6}L${lp[0] + 300} ${lp[1] + 26}L${lp[0] + 250} ${lp[1] + 44}Z`, 0.36));
s.push(K.stoneLantern({ x: lp[0], y: lp[1], scale: 1.36 }));
s.push(K.scentWisps({ x: lp[0] + 4, y: lp[1] - 376, count: 2, h: 120, color: C.sage, seed: 4 }));

/* ---------- Mikan, from behind ---------- */
const mk = { x: 900, y: 936 };
s.push(K.castShadow(`M${mk.x - 40} ${mk.y - 6}L${mk.x + 40} ${mk.y - 12}L${mk.x + 250} ${mk.y + 14}L${mk.x + 190} ${mk.y + 34}Z`, 0.34));
s.push(K.cat({ ...K.CAST.mikan, pose: 'back', x: mk.x, y: mk.y, scale: 2.15 }));
s.push(K.ticks({ x: mk.x, y: mk.y - 66, r: 38, n: 2, a0: 200, a1: 165, len: 13 }) + K.ticks({ x: mk.x, y: mk.y - 66, r: 38, n: 2, a0: -20, a1: 15, len: 13 }));

/* ---------- a passer-by, as weather: legs, hem, shopping ---------- */
const hm = { x: 1640, y: 1010 };
s.push(K.castShadow(`M${hm.x - 150} ${hm.y - 6}L${hm.x + 110} ${hm.y - 16}L${hm.x + 420} ${hm.y + 40}L${hm.x + 60} ${hm.y + 60}Z`, 0.36));
s.push(K.human({ pose: 'walk', palette: 'street', garment: 'skirt', carry: 'bag', x: hm.x, y: hm.y, scale: 2.02, flip: true, shadow: false }));

/* ---------- foreground framing + light ---------- */
s.push(K.glow(1060, 760, 760, 300, '#FFF0C0', 0.26));

document.getElementById('stage').innerHTML = K.svg(W, H, s.join(''), 'class="k-world"') + `
  <div class="k-drowsy"></div>
  <div class="k-abs" id="dial">${K.ui.phaseDial({ phase: 'day', t: 0.86, size: 190 })}</div>
  <div class="k-abs k-prompt" id="prompt-spray">${K.ui.faceButtons({ size: 52, lit: 'n' })}${K.ui.icon({ name: 'spray', size: 44, color: C.gold })}Spray</div>
  <div class="k-abs k-prompt k-prompt--hold" id="prompt-home">${K.ui.dpad({ size: 52, lit: 's' })}${K.ui.icon({ name: 'bell', size: 40 })}${K.ui.paw({ size: 38, fill: C.gold })}</div>`;
</script>
</body>
</html>
