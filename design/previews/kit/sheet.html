<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat RPG — art kit model sheet</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { margin: 0; }
  .grid { display: flex; gap: 18px; flex-wrap: wrap; }
  .cell { position: relative; }
  .cell .lab { position: absolute; left: 12px; top: 10px; background: #FBF3DF; padding: 2px 8px; border-radius: 10px; z-index: 2; }
  .cell svg { display: block; }
  .ui-row { display: flex; gap: 34px; align-items: center; flex-wrap: wrap; padding: 26px 30px; }
  .sub { font: 700 22px/1.3 var(--font); color: var(--cocoa); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="k-sheet" id="sheet">
  <h1>Cat RPG — art kit model sheet</h1>
  <p class="sub">Ink what acts, paint what stays. Cats, humans, props and VFX: flat two-tone cels, even Aubergine Ink line. World: unlined layered paint. UI: cream-and-cocoa beans, poms and chestnuts.</p>
  <div id="out"></div>
</div>
<script src="kit.js"></script>
<script>
const K = Kit, C = K.C, out = document.getElementById('out');
const h2 = (t) => `<h2>${t}</h2>`;
const cell = (w, h, label, content, bg) => `<div class="cell" style="width:${w}px;height:${h}px;${bg ? 'background:' + bg : ''}"><span class="lab">${label}</span>${K.svg(w, h, content)}</div>`;
const floor = (w, h, gy) => `<rect x="0" y="${gy - 6}" width="${w}" height="${h - gy + 6}" fill="#E4D5B4"/><rect x="0" y="${gy - 6}" width="${w}" height="5" fill="#F7EBD0"/>`;
let html = '';

/* 1 — Mikan, every pose */
const M = K.CAST.mikan;
const poses = [['back', 1.8], ['side-walk', 1.75], ['side-pounce', 1.5], ['front-sit', 1.8], ['loaf', 1.8], ['hiss', 1.6], ['frazzled', 1.6]];
html += h2('Mikan — every pose (protagonist: ginger cap, red bell collar, pom tail)') + '<div class="grid">';
poses.forEach(([p, s]) => {
  const w = p.startsWith('side') || p === 'hiss' ? 300 : 196, hgt = 300, gy = 262;
  let extra = '';
  if (p === 'frazzled') extra = K.frazzleOrbit({ x: w / 2, y: gy - 190, r: 78 });
  html += cell(w, hgt, p, floor(w, hgt, gy) + K.cat({ ...M, pose: p, x: w / 2 + (p === 'side-pounce' ? -6 : 0), y: gy - (p === 'side-pounce' ? 20 : 0), scale: s }) + extra);
});
html += '</div>';

/* 2 — the cast from behind: the exploration read */
const cast = Object.keys(K.CAST);
html += h2('The cast from behind — the gameplay camera read (tail carriage, ears, back pattern)') + '<div class="grid">';
let row = '', sil = '';
const W = 1824, step = W / cast.length;
cast.forEach((n, i) => {
  const c = K.CAST[n], sc = 1.55 * (n === 'daifuku' ? 1.3 : 1), x = step * (i + 0.5);
  row += K.cat({ ...c, pose: 'back', x, y: 300, scale: sc }) + `<text x="${x}" y="336" text-anchor="middle" font-family="M PLUS Rounded 1c" font-weight="800" font-size="20" fill="${C.cocoa}">${n}</text>`;
  sil += K.cat({ ...c, pose: 'back', x, y: 250, scale: sc * 0.9, shadow: false });
});
html += cell(W, 350, 'back', floor(W, 350, 300) + row);
html += `<div class="cell" style="width:${W}px;height:270px"><span class="lab">same, as flat silhouettes (must still be six different cats + Mikan)</span>${K.svg(W, 270, `<g style="filter:brightness(0)">${sil}</g>`)}</div>`;
html += '</div>';

/* 3 — the cast, front and side */
html += h2('The cast — close-up sit and walk (personality gait = tail carriage)') + '<div class="grid">';
row = '';
cast.forEach((n, i) => { const c = K.CAST[n], sc = 1.5 * (n === 'daifuku' ? 1.3 : 1), x = step * (i + 0.5); row += K.cat({ ...c, pose: n === 'daifuku' ? 'loaf' : 'front-sit', x, y: 290, scale: sc }); });
html += cell(W, 320, 'front-sit / loaf', floor(W, 320, 290) + row);
row = '';
cast.forEach((n, i) => { const c = K.CAST[n], sc = 1.18 * (n === 'daifuku' ? 1.25 : 1), x = step * (i + 0.5) + 6; row += K.cat({ ...c, pose: 'side-walk', x, y: 300, scale: sc, flip: i % 2 === 1 }); });
html += cell(W, 330, 'side-walk', floor(W, 330, 300) + row);
html += '</div>';

/* 4 — fight poses, outlines, scars */
html += h2('Fight poses, Clowder outlines, Scars') + '<div class="grid">';
html += cell(560, 330, 'side-pounce + slash arc (Posse: Bell-Gold keyline + Cream rim)', floor(600, 330, 300) + K.speedLines({ x: 20, y: 120, w: 250, h: 120, angle: -20, count: 9 }) + K.cat({ ...M, pose: 'side-pounce', x: 270, y: 270, scale: 1.5, outline: 'gold', expr: 'angry' }) + K.slashArc({ x: 430, y: 190, r: 110, a0: -80, a1: 60 }));
html += cell(380, 330, 'hiss (Wall Sitter: Sage outline + Cream rim)', floor(400, 330, 300) + K.cat({ ...K.CAST.braggart, pose: 'hiss', x: 190, y: 300, scale: 1.7, outline: 'sage' }));
html += cell(340, 330, 'frazzled (reads in silhouette)', floor(340, 330, 300) + K.cat({ ...K.CAST.brooder, pose: 'frazzled', x: 100, y: 300, scale: 1.3 }) + K.frazzleOrbit({ x: 100, y: 160, r: 64 }) + `<g style="filter:brightness(0)">${K.cat({ ...K.CAST.brooder, pose: 'frazzled', x: 256, y: 300, scale: 0.8, shadow: false })}</g>`);
let sc = '';
[['notch', 'oldWallCat'], ['fold', 'stalwart'], ['kink', 'schemer'], ['puff', 'braggart'], ['cowlick', 'fraidy'], ['plaster', 'mikan']].forEach(([s, n], i) => {
  const c = { ...K.CAST[n] }; c.scars = [s]; if (n === 'stalwart') c.scars = ['fold'];
  sc += K.cat({ ...c, pose: 'back', x: 48 + i * 79, y: 290, scale: 0.9, carry: s === 'kink' || s === 'puff' ? 'flag' : c.carry }) + `<text x="${48 + i * 79}" y="318" text-anchor="middle" font-family="M PLUS Rounded 1c" font-weight="800" font-size="16" fill="${C.cocoa}">${s}</text>`;
});
html += cell(490, 330, 'silhouette Scars (read from behind)', floor(490, 330, 290) + sc);
html += '</div>';

/* 5 — humans from cat height */
html += h2('Humans from cat height — legs, hems, shoes, hands (faces stay out of frame)') + '<div class="grid">';
const hs = 0.72, hy = 400;
html += cell(1824, 430, 'walk (street, muted) · stand (Haru: navy + yellow socks) · walk (trousers) · reach (Haru at home) · stand (Gran, plum)',
  floor(1824, 430, hy)
  + K.human({ pose: 'walk', palette: 'street', x: 220, y: hy, scale: hs }) + K.cat({ ...M, pose: 'side-walk', x: 420, y: hy, scale: hs, flip: true })
  + K.human({ pose: 'stand', palette: 'haruUniform', carry: 'none', x: 640, y: hy, scale: hs })
  + K.human({ pose: 'walk', palette: 'streetB', garment: 'trousers', carry: 'none', x: 960, y: hy, scale: hs, flip: true })
  + K.human({ pose: 'reach', palette: 'haruHome', garment: 'trousers', x: 1300, y: hy, scale: hs }) + K.cat({ ...M, pose: 'front-sit', x: 1452, y: hy, scale: hs, expr: 'happy' })
  + K.human({ pose: 'stand', palette: 'gran', garment: 'trousers', carry: 'bag', x: 1640, y: hy, scale: hs }));
html += '</div>';

/* 6 — painted world */
html += h2('Painted world helpers — unlined, layered paint (sky, cumulus, foliage, plaster, fence, roof, lane) + inked props') + '<div class="grid">';
html += cell(680, 420, 'sky + cloud + hill + sea', K.sky({ w: 700, h: 420 }) + K.cloud({ x: 250, y: 330, w: 420, h: 300, seed: 3 }) + K.cloud({ x: 580, y: 330, w: 240, h: 150, seed: 8 }) + K.sea({ x: 0, y: 330, w: 700, h: 90 }) + K.hill({ pts: [[380, 330], [470, 280], [560, 262], [640, 290], [700, 276]], baseY: 345, color: '#5F9F88' }));
html += cell(530, 420, 'foliage · flowers · grass', `<rect width="540" height="420" fill="#BFE0F0"/>` + K.foliage({ x: 380, y: 150, w: 300, h: 220, seed: 6, far: true, tones: { dark: '#4E8F7E', mid: '#6FA98C', light: '#9CC9A0' } }) + K.foliage({ x: 190, y: 190, w: 330, h: 260, seed: 2 }) + `<rect y="340" width="540" height="80" fill="#C9BC9F"/>` + K.flowers({ x: 400, y: 320, w: 230, h: 100, seed: 4 }) + K.grass({ x1: 20, y1: 350, x2: 300, y2: 352, n: 22, h: 30, seed: 3 }));
html += cell(578, 420, 'wall (coping = High Road ribbon) · fence · roof · ground · pole', K.sky({ w: 560, h: 300 }) + K.roof({ quad: [[250, 70], [560, 60], [600, 170], [210, 180]] }) + K.surface({ pts: [[230, 178], [560, 172], [560, 300], [230, 300]], color: '#E9D6B4' }) + K.ground({ pts: [[0, 290], [560, 290], [560, 420], [0, 420]] }) + K.wall({ quad: [[0, 150], [250, 170], [250, 305], [0, 330]] }) + K.fence({ quad: [[280, 190], [560, 180], [560, 320], [280, 310]], n: 11 }) + K.pole({ x: 262, y: 322, h: 310, w: 16 }) + K.castShadow('M0 330L250 305L330 330L60 400L0 400Z', 0.4));
html += '</div><div class="grid" style="margin-top:18px">';
html += cell(520, 330, 'inked props: Scent Post (stone lantern) + wisps · pot · bucket', K.ground({ pts: [[0, 220], [520, 220], [520, 330], [0, 330]] }) + K.surface({ pts: [[0, 0], [520, 0], [520, 224], [0, 224]], color: C.plaster }) + K.stoneLantern({ x: 150, y: 306, scale: 0.66 }) + K.scentWisps({ x: 150, y: 124, count: 3, h: 50 }) + K.prop({ kind: 'pot', x: 330, y: 290, scale: 1.3 }) + K.prop({ kind: 'bucket', x: 440, y: 296, scale: 1.3 }));

/* 7 — VFX */
html += cell(650, 330, 'VFX: slash arc · impact burst (Thump star) · dust cloud · speed lines · sparkle · scent wisps',
  K.speedLines({ mode: 'radial', x: 0, y: 0, w: 660, h: 330, count: 30, inner: 0.72 })
  + K.slashArc({ x: 120, y: 210, r: 100, a0: -160, a1: -20 }) + K.impactBurst({ x: 300, y: 130, r: 70, star: true, seed: 2 }) + K.impactBurst({ x: 300, y: 262, r: 44, color: C.claw, seed: 5, points: 9 })
  + K.dustCloud({ x: 470, y: 230, r: 58, seed: 3 }) + K.sparkle({ x: 420, y: 80, r: 22 }) + K.scentWisps({ x: 566, y: 196, count: 3, h: 100, color: C.gold }) + K.ticks({ x: 470, y: 150, r: 20, n: 3 }));
html += cell(618, 330, 'lettering: Cream fill, Ink line, offset print in the damage colour, letters grow along the hit', `<rect width="608" height="330" fill="#E9DBBB"/>` + K.sfx({ text: 'SKRITCH', x: 310, y: 172, size: 84, rot: -9, color: C.claw }) + K.sfx({ text: 'WHAM', x: 170, y: 292, size: 84, rot: 5, color: C.ink, seed: 4 }) + K.sfx({ text: 'YOWWL', x: 470, y: 290, size: 54, rot: -12, color: C.yowl, seed: 7 }));
html += '</div><div class="grid" style="margin-top:18px">';
html += cell(900, 200, 'telegraph decals: white = dodge · yellow = Hiss it · red = get out', K.ground({ pts: [[0, 0], [900, 0], [900, 200], [0, 200]] }) + K.telegraph({ kind: 'white', x: 160, y: 120, rx: 120, ry: 44 }) + K.telegraph({ kind: 'yellow', x: 450, y: 120, rx: 120, ry: 44 }) + K.telegraph({ kind: 'red', x: 740, y: 120, rx: 120, ry: 44 }));
html += cell(906, 200, 'ribbons: Head Home thread (Bell-Gold, Cream rim) · Tag-In streak', K.ground({ pts: [[0, 0], [906, 0], [906, 200], [0, 200]] }) + K.ribbon({ pts: [[30, 150], [150, 90], [280, 140], [420, 80], [520, 110]], width: 9 }) + K.ribbon({ pts: [[560, 170], [700, 110], [870, 60]], width: 40, grow: (t) => 0.2 + t }));
html += '</div>';
out.innerHTML = html;

/* 8 — UI (HTML + kit.css) */
const pads = (n, max) => `<span class="k-pads">${Array.from({ length: max }, (_, i) => K.ui.paw({ size: 40, fill: i < n ? C.pad : C.recessed })).join('')}</span>`;
out.insertAdjacentHTML('beforeend', h2('UI — rounded, cream-and-brown, bubbly: beans, poms, chestnuts') + `
<div class="cell ui-row" style="background:#9CC4D8">
  <div class="k-panel" style="width:660px"><div class="k-h">Bean panel</div><div class="k-body">Paper Cream ground, Cocoa frame, soft Wisteria drop shadow. Body text is Ink, 32 px.</div><div class="k-row" style="margin-top:16px"><span class="k-btn k-btn--focus">Focus</span><span class="k-btn k-btn--primary">Primary</span><span class="k-btn k-btn--confirm">Confirm</span><span class="k-btn k-btn--disabled">Off</span></div></div>
  <div style="padding-top:26px"><div class="k-bubble"><span class="k-ribbon k-ribbon--sage">${K.ui.icon({ name: 'brick', size: 30 })}Thorn</span>Use your whiskers, Collar.<br>This post is ours.</div></div>
  <div style="padding-top:26px"><div class="k-bubble k-bubble--right" style="max-width:420px"><span class="k-ribbon k-ribbon--gold">${K.ui.icon({ name: 'bell', size: 30 })}Mikan</span>Not for long.</div></div>
  <div style="display:flex;flex-direction:column;gap:14px"><span class="k-ribbon k-ribbon--stray">Stray</span><span class="k-pill">Lane Cat</span><span class="k-pill k-pill--gold">Posse</span><span class="k-pill k-pill--sage">Wall Sitters</span><span class="k-pill k-pill--cream">Keeper</span></div>
</div>
<div class="cell ui-row" style="background:#9CC4D8;margin-top:18px">
  <div>${K.ui.phaseDial({ phase: 'morning', t: 0.15, size: 150 })}</div><div>${K.ui.phaseDial({ phase: 'day', t: 0.55, size: 150 })}</div><div>${K.ui.phaseDial({ phase: 'dusk', t: 0.9, size: 150 })}</div><div>${K.ui.phaseDial({ phase: 'night', t: 0.4, size: 150 })}</div>
  <div class="k-patchtag">${K.ui.icon({ name: 'brick', size: 44 })}Low Wall Corner ${K.ui.wispRow({ n: 2 })}</div>
  <div class="k-prompt">${K.ui.faceButtons({ size: 52, lit: 'n' })}${K.ui.icon({ name: 'spray', size: 44 })}Spray</div>
  <div class="k-prompt k-prompt--hold">${K.ui.dpad({ size: 52, lit: 's' })}${K.ui.paw({ size: 40, fill: C.gold })}</div>
  <span class="k-btn k-key">E</span>
</div>
<div class="cell ui-row" style="background:#9CC4D8;margin-top:18px">
  <div style="display:flex;flex-direction:column;gap:12px"><div class="k-gauge" style="--v:72%"><i></i></div><div class="k-gauge k-gauge--low" style="--v:20%"><i></i></div><div class="k-gauge k-gauge--zoomies" style="--v:45%"><i></i></div><div class="k-gauge k-gauge--frazzle" style="--v:64%"><i></i></div></div>
  ${pads(2, 3)}
  ${K.ui.portrait({ cat: { ...K.CAST.mikan }, size: 130, ring: C.gold })}${K.ui.portrait({ cat: { ...K.CAST.braggart }, size: 130, ring: C.sage })}${K.ui.portrait({ cat: { ...K.CAST.schemer }, size: 130 })}${K.ui.portrait({ cat: { ...K.CAST.goofball }, size: 130 })}
  ${['spray', 'sniff', 'nap', 'bell', 'brick', 'fish', 'heart', 'storm'].map((n) => K.ui.icon({ name: n, size: 54 })).join('')}
  <div class="k-band">Standoff band</div>
</div>`);
</script>
</body>
</html>
