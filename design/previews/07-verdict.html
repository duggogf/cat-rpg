<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat RPG — Frame 07: The Verdict (mock screenshot)</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  body { margin: 0; background: #111; }
  .vc { position: absolute; width: 440px; box-sizing: border-box; padding: 18px 26px 20px; }
  .vc .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .vc .hd .t { font: 800 40px/1 var(--font); color: var(--cocoa); letter-spacing: .01em; }
  .vc .hd svg { display: block; flex: none; }
  .vc .ln { font: 500 28px/1.25 var(--font); color: var(--ink); }
  .vc .ln b { font-weight: 800; }
  .vc .risk { font: 700 28px/1.25 var(--font); color: #7E6A86; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .vc--raised { border-color: var(--ink); border-width: 4px; box-shadow: 0 0 0 6px var(--gold), 6px 10px 0 rgba(110,106,168,.55); }
  #v-up { left: 740px; top: 36px; }
  #v-down { left: 740px; top: 846px; }
  #v-left { left: 44px; top: 380px; }
  #v-right { left: 1424px; top: 300px; width: 460px; padding-bottom: 22px; }
  .bribe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .bribe .opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 10px; border: 3px solid var(--cocoa); border-radius: 22px 26px 22px 28px / 26px 22px 28px 22px; background: var(--recessed); }
  .bribe .opt .n { font: 800 28px/1 var(--font); color: var(--cocoa); }
  .bribe .opt .p { font: 800 34px/1 var(--font); color: var(--ink); display: flex; align-items: center; gap: 4px; }
  .bribe .opt .l { font: 700 24px/1 var(--font); color: #7E6A86; }
  .bribe .opt--on { background: var(--gold); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .bribe .opt--on .n, .bribe .opt--on .l { color: var(--ink); }
  .bribe .opt--short { background: repeating-linear-gradient(-45deg, var(--recessed) 0 6px, #E9D7B8 6px 9px); opacity: .75; }
  .stash { display: flex; justify-content: space-between; margin-top: 10px; font: 700 28px/1 var(--font); color: var(--cocoa); }
  .stash span { display: flex; align-items: center; gap: 6px; }
  #foot-l { left: 44px; bottom: 40px; }
  #foot-r { right: 44px; bottom: 40px; display: flex; align-items: center; gap: 12px; }
  #foot-r .ring { width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--gold) 0 38%, var(--recessed) 38% 100%); border: 3px solid var(--cocoa); box-sizing: border-box; }
  #title { left: 50%; top: 250px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>
<div class="k-stage" id="stage"></div>
<script src="kit/kit.js"></script>
<script src="rival-helpers.js"></script>
<script>
/* FRAME 07 — THE VERDICT. Tofu Shop Step, late Day. The Posse has Routed Kagi, Captain of Tofu Shop Step.
 * Low two-shot, HUD hidden, the clock paused. Four Verdicts on the fixed compass: Up Nose-Touch, Down Humble,
 * Left Chase Off, Right Recruit (raised: the Bribe row is open on Fair; Feast is beyond the Stash).
 * Perspective: horizon y=470, focal 1300, camera 0.45 m up (low). */
const K = Kit, C = K.C, W = 1920, H = 1080, HZ = 470, F = 1300, CX = 960, CH = 0.45;
const P = (X, Y, d) => [CX + X * F / d, HZ + (CH - Y) * F / d];
const s = [];

/* ---------- sky slice + the shop street behind ---------- */
s.push(K.sky({ w: W, h: 520, phase: 'day', zenith: '#4FA0E6', horizon: '#FFE2B0' }));
s.push(K.cloud({ x: 1500, y: 420, w: 700, h: 360, seed: 14, shade: '#D8C2D8', light: '#FFF6E6' }));
s.push(K.cloud({ x: 300, y: 380, w: 420, h: 200, seed: 6, shade: '#D8C6DA', light: '#FFF8EA', opacity: 0.95 }));
s.push(K.glow(1700, 200, 900, 400, '#FFE6B0', 0.5));
// far houses + hill greenery at the end of the lane
s.push(K.foliage({ x: 160, y: 300, w: 520, h: 260, seed: 81, far: true, tones: { dark: '#4F8A6A', mid: '#6CA06E', light: '#9CC67C' } }));
s.push(K.foliage({ x: 1760, y: 320, w: 460, h: 240, seed: 83, far: true, tones: { dark: '#4F8A6A', mid: '#6CA06E', light: '#9CC67C' } }));
s.push(K.surface({ pts: [[-10, 330], [380, 300], [380, 480], [-10, 480]], color: '#F1DCC0', grime: 0.2 }));
s.push(K.roof({ quad: [[-20, 250], [360, 230], [400, 310], [-30, 336]], rows: 4, cols: 10 }));
s.push(K.surface({ pts: [[1560, 300], [1930, 320], [1930, 480], [1560, 480]], color: '#EAD6BE', grime: 0.2 }));
s.push(K.roof({ quad: [[1580, 230], [1940, 246], [1950, 330], [1540, 310]], rows: 4, cols: 10, color: '#7C8EA6' }));

/* ---------- the Tofu Shop: wooden front, noren with Scribble, glass doors, the Step ---------- */
s.push(K.surface({ pts: [[360, 120], [1580, 120], [1580, 482], [360, 482]], color: '#C99A6A', grime: 0.25, tex: 'brush-v', texOpacity: 0.35 }));
s.push(K.roof({ quad: [[330, 60], [1610, 60], [1660, 150], [280, 150]], rows: 3, cols: 26, color: '#5E6E88' }));
s.push(K.castShadow('M300 150H1640V196H300Z', 0.45));
// sliding glass doors
let doors = ''; for (let i = 0; i < 6; i++) { const x = 520 + i * 150; doors += `<rect x="${x}" y="218" width="142" height="262" fill="#A9C4D6"/><rect x="${x}" y="218" width="142" height="262" fill="none" stroke="#7A5338" stroke-width="7"/><path d="M${x + 8} 226L${x + 70} 226L${x + 14} 330Z" fill="#E8F4FA" opacity="0.55"/><path d="M${x} 350H${x + 142}" stroke="#7A5338" stroke-width="5"/>`; }
s.push(`<g filter="url(#k-rough)">${doors}</g>`);
// noren curtain: three indigo panels with Scribble (human writing stays illegible)
let noren = ''; for (let i = 0; i < 4; i++) { const x = 760 + i * 106; noren += `<path d="M${x} 196H${x + 100}V300Q${x + 50} 306 ${x} 300Z" fill="#3E4C86"/><path d="M${x + 22} 228q20 -6 30 6t28 -4M${x + 30} 256q12 8 34 -2" stroke="#F4ECDC" stroke-width="5" fill="none" stroke-linecap="round"/>`; }
s.push(`<g filter="url(#k-rough)"><path d="M748 192H1188" stroke="#7A5338" stroke-width="8"/>${noren}</g>`);
// signboard with Scribble
s.push(`<g filter="url(#k-rough)"><rect x="560" y="160" width="140" height="44" fill="#F4E6CC"/><path d="M576 182q20 -10 40 2t44 -4" stroke="#6B4A35" stroke-width="5" fill="none"/></g>`);
// potted plants, crates of soy bottles, a bench
s.push(K.prop({ kind: 'pot', x: 430, y: 486, scale: 1.4 }) + K.prop({ kind: 'pot', x: 1520, y: 486, scale: 1.2 }));
s.push(K.flowers({ x: 1660, y: 470, w: 200, h: 80, seed: 5 }));
// the Step: a long stone step in front of the shop
s.push(K.surface({ pts: [[300, 482], [1640, 482], [1680, 520], [260, 520]], color: '#CFC6BC', grime: 0.2 }));
s.push(K.surface({ pts: [[260, 520], [1680, 520], [1680, 548], [260, 548]], color: '#A79DA6', grime: 0.1 }));

/* ---------- the lane (the fight ring) ---------- */
s.push(K.ground({ pts: [[-10, 540], [W + 10, 540], [W + 10, H + 10], [-10, H + 10]], seed: 6 }));
s.push(K.castShadow('M260 548H1680L1720 600H220Z', 0.35));
s.push(K.glow(960, 760, 900, 300, '#FFF0C8', 0.45));
// the ring edge: scuffs and dust from the fight
s.push(`<g filter="url(#k-rough)" fill="none" stroke="#9A8C78" stroke-width="3" opacity="0.55"><path d="M560 860q60 -20 120 6M1260 900q70 -14 120 10M400 700q40 -10 70 8"/></g>`);

/* ---------- the Routed Captain, flattened in the dust ---------- */
const kg = { x: 820, y: 742 };
s.push(K.dustCloud({ x: kg.x - 170, y: kg.y - 20, r: 46, puffs: 5, seed: 3 }) + K.dustCloud({ x: kg.x + 150, y: kg.y - 6, r: 36, puffs: 4, seed: 5 }));
s.push(K.shadow({ x: kg.x, y: kg.y, rx: 170, ry: 18, opacity: 0.4 }));
s.push(`<g transform="translate(${kg.x} ${kg.y}) scale(1.16 0.82) translate(${-kg.x} ${-kg.y})">${K.cat({ ...RV.CAST.kagi, pose: 'loaf', expr: 'spiral', x: kg.x, y: kg.y, scale: 2.3, shadow: false })}</g>`);
s.push(K.frazzleOrbit({ x: kg.x - 10, y: kg.y - 168, r: 84 }));
s.push(`<g transform="translate(${kg.x - 40} ${kg.y - 186}) rotate(-20)">${K.inked('M-5 -16H5V12H-5Z', '#F2D8A0', 2)}</g>`); // its clothes-peg, knocked askew

/* ---------- Mikan and the Posse ---------- */
const mk = { x: 1170, y: 800 };
s.push(K.castShadow(`M${mk.x - 120} ${mk.y - 4}L${mk.x + 130} ${mk.y - 8}L${mk.x + 240} ${mk.y + 26}L${mk.x - 20} ${mk.y + 34}Z`, 0.3));
s.push(K.cat({ ...K.CAST.oldWallCat, pose: 'front-sit', expr: 'neutral', collar: 'cord', outline: 'gold', x: 1330, y: 684, scale: 1.55 }));
s.push(K.cat({ ...K.CAST.goofball, pose: 'front-sit', expr: 'happy', collar: 'cord', outline: 'gold', x: 1060, y: 640, scale: 1.3, flip: true }));
s.push(K.cat({ ...K.CAST.mikan, pose: 'side-walk', carry: 'spring', outline: 'gold', expr: 'smug', x: mk.x, y: mk.y, scale: 2.15, flip: true }));
s.push(K.ticks({ x: mk.x + 150, y: mk.y - 200, r: 30, n: 3, a0: -120, a1: -30, len: 12 })); // tail-beckon (Recruit preview)
s.push(K.sparkle({ x: 690, y: 560, r: 16 }) + K.sparkle({ x: 960, y: 600, r: 10 }));

/* ---------- light ---------- */
s.push(`<rect width="${W}" height="${H}" fill="#FFF2D6" opacity="0.06"/>`);

/* ---------- UI: the four Verdicts ---------- */
const arrow = (dir, lit) => { const r = { up: 0, right: 90, down: 180, left: 270 }[dir]; return `<svg width="52" height="52" viewBox="-26 -26 52 52"><circle r="23" fill="${lit ? C.gold : C.cream}" stroke="${lit ? C.ink : C.cocoa}" stroke-width="3"/><path d="M0 -12L11 4H4V12H-4V4H-11Z" transform="rotate(${r})" fill="${lit ? C.ink : C.cocoa}"/></svg>`; };
const ic = (g, c) => RV.stamp(g, { size: 56, color: c || C.cream });
const G = RV.GLYPH, st2 = `stroke="${C.ink}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
const noses = `<path d="M-16 -2Q-16 -9 -9 -9H-3Q1 -9 1 -3Q-2 6 -8 7Q-14 6 -16 -2Z" fill="${C.pad}" ${st2}/><path d="M16 -2Q16 -9 9 -9H3Q-1 -9 -1 -3Q2 6 8 7Q14 6 16 -2Z" fill="${C.pad}" ${st2}/><path d="M-6 -16l3 4M6 -16l-3 4M0 -18v4" ${st2} fill="none"/>`;
const crateG = `<path d="M-14 -6H14V12H-14Z" fill="#C8A06A" ${st2}/><path d="M-12 -12H16L14 -6H-14Z" fill="#E6CDA0" ${st2}/><path d="M-14 3H14M-5 -6V12M5 -6V12" fill="none" stroke="${C.ink}" stroke-width="1.8"/>`;
const cordG = `<path d="M-14 4Q0 -14 14 4" fill="none" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/><path d="M-14 4Q0 -14 14 4" fill="none" stroke="${C.gold}" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="0" cy="-5" rx="7" ry="5" fill="${C.gold}" stroke="${C.ink}" stroke-width="2.4"/><path d="M-2 -1l-4 12M2 -1l5 11" stroke="${C.ink}" stroke-width="2.4" stroke-linecap="round"/>`;
const fish = `<svg width="30" height="30" viewBox="-20 -20 40 40"><path d="M-16 0Q-4 -13 8 0Q-4 13 -16 0ZM8 0l10 -9v18z" fill="${C.fish}" stroke="${C.ink}" stroke-width="2.6" stroke-linejoin="round"/><circle cx="-8" cy="-2" r="1.8" fill="${C.ink}"/></svg>`;
const tail = `<svg width="30" height="30" viewBox="-15 -15 30 30"><path d="M-10 12Q-12 -2 0 -6Q10 -10 8 -14" fill="none" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/><path d="M-10 12Q-12 -2 0 -6Q10 -10 8 -14" fill="none" stroke="#CDD1DC" stroke-width="3.5" stroke-linecap="round"/></svg>`;
const ears = `<svg width="30" height="30" viewBox="-16 -16 32 32"><path d="M-14 8L-10 -12L-2 2ZM14 8L10 -12L2 2Z" fill="#CDD1DC" stroke="${C.ink}" stroke-width="2.6" stroke-linejoin="round"/></svg>`;

document.getElementById('stage').innerHTML = K.svg(W, H, s.join(''), 'class="k-world"') + `
  <div class="k-panel vc" id="v-up"><div class="hd">${arrow('up')}${ic(noses)}<span class="t">Nose-Touch</span></div>
    <div class="ln">Offer respect. They may accept.</div><div class="risk">${ears}They keep the Step. 5-day truce.</div></div>
  <div class="k-panel vc" id="v-left"><div class="hd">${arrow('left')}${ic(G.run)}<span class="t">Chase Off</span></div>
    <div class="ln">Gone from the Lane.<br>The Step is yours.</div><div class="risk">${tail}Comes back changed.</div></div>
  <div class="k-panel vc" id="v-down"><div class="hd">${arrow('down')}${ic(crateG)}<span class="t">Humble</span></div>
    <div class="ln">Stays on the crate and pays.</div><div class="risk">${tail}Simmers unless guarded.</div></div>
  <div class="k-panel vc vc--raised" id="v-right"><div class="hd">${arrow('right', true)}${ic(cordG, '#FFE7A8')}<span class="t">Recruit</span></div>
    <div class="ln">Joins your Crew with everything it remembers.</div>
    <div class="bribe">
      <div class="opt"><span class="n">None</span><span class="p">0</span><span class="l">Aloof</span></div>
      <div class="opt opt--on"><span class="n">Fair</span><span class="p">${fish}96</span><span class="l">Aloof</span></div>
      <div class="opt opt--short"><span class="n">Feast</span><span class="p">${fish}192</span><span class="l">Steady</span></div>
    </div>
    <div class="stash"><span>${fish}Stash 150</span><span>Crew 4/6</span></div></div>
  <div class="k-abs" id="title"><span class="k-ribbon k-ribbon--sage">Kagi · Captain of Tofu Shop Step</span></div>
  <div class="k-abs k-prompt" id="foot-l">${K.ui.faceButtons({ size: 46, lit: 'n' })}Their card</div>
  <div class="k-abs k-prompt" id="foot-r">${K.ui.faceButtons({ size: 46, lit: 's' })}Hold to decide<span class="ring"></span></div>`;
</script>
</body>
</html>
