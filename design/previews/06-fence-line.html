<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat RPG — Frame 06: The Rivals Board (mock screenshot)</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  body { margin: 0; background: #111; }
  /* header: one bean, place name + scene strip only (no bar, no crown, no %) */
  .hdr { left: 24px; top: 20px; width: 1872px; height: 72px; padding: 0 22px 0 30px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; }
  .strip { display: flex; align-items: center; gap: 10px; }
  .sc { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .em { width: 44px; height: 44px; border-radius: 50%; background: var(--cream); border: 3px solid var(--cocoa); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
  .em svg { display: block; }
  .em--haze { opacity: .5; }
  .pill { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px 0 4px; border-radius: 24px 22px 25px 21px; background: var(--cocoa); font: 800 28px/1 var(--font); color: var(--cream); }
  .pill .em { border-color: var(--ink); }
  .dots { display: flex; gap: 3px; height: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; }
  .dots .m { background: var(--cocoa); }
  .dots .s { border: 1.5px solid var(--cocoa); }
  .sh { min-width: 46px; height: 40px; font-size: 22px; padding: 0 8px; }
  /* one name ribbon per cat */
  .nm { position: absolute; transform: translateX(-50%); display: flex; align-items: center; }
  .nm .k-ribbon { height: 40px; font-size: 28px; padding: 0 26px 0 14px; }
  .nm--dim { opacity: .55; }
  .nm--focus .k-ribbon { --k-clowder: var(--sage); box-shadow: 0 0 0 4px var(--gold); }
  .star { position: absolute; right: 8px; top: -12px; }
  .rtag { margin-left: -4px; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 8px; background: var(--cream); border: 3px solid var(--ink); border-radius: 8px 12px 10px 12px; box-shadow: 2px 3px 0 rgba(110,106,168,.6); font: 800 28px/1 var(--font); color: var(--ink); transform: rotate(-3deg); }
  .rtag svg { display: block; }
  /* the card (focus only), bottom-left 676 x 256 */
  #card { left: 24px; top: 800px; width: 676px; height: 256px; padding: 0; overflow: visible; }
  #card .head { position: relative; display: flex; align-items: center; gap: 12px; margin: -26px 0 0 -10px; height: 80px; padding: 0 56px 0 12px; width: max-content; box-sizing: border-box;
    background: var(--sage); color: var(--ink); border: 4px solid var(--ink); border-right: 0; clip-path: polygon(0 0, 100% 0, calc(100% - 36px) 100%, 0 100%); font: 800 36px/1 var(--font); }
  #card .head small { font: 700 28px/1 var(--font); }
  #card .r { display: flex; align-items: center; gap: 10px; padding: 6px 24px 0; font: 700 28px/1.1 var(--font); color: var(--ink); white-space: nowrap; }
  #card .r svg { display: block; flex: none; }
  #card .sep { width: 3px; height: 28px; background: #D9C3A0; margin: 0 4px; }
  #card .sw { display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 20px; background: var(--ink); color: var(--cream); font: 800 26px/1 var(--font); }
  #card .day { font: 800 24px/1 var(--font); color: var(--cocoa); }
  #card .q { font-weight: 500; }
  #help { right: 24px; bottom: 24px; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="k-stage" id="stage"></div>
<script src="kit/kit.js"></script>
<script src="rival-helpers.js"></script>
<script>
/* FRAME 06 — THE RIVALS BOARD, staged (owner direction C6). Hidamari Lane, late afternoon.
 * One gang staged in a narrow alley in deep perspective: Daifuku on the raised porch at the vanishing point (crown,
 * steam puffs = anger), his gang down the steps toward the camera by standing, each with a name ribbon and a role tag,
 * dashed arrows showing who answers to whom. One cat not met yet (silhouette). Focus/hover is on DAIFUKU: the only tie
 * outside his gang, Old Gang, hangs on Hige at the alley mouth (from Hige's own Memory).
 * Perspective: vanishing point (960, 300). */
const K = Kit, C = K.C, W = 1920, H = 1080, VX = 960, VY = 300;
const s = [];
const sil = (svg) => `<g filter="url(#rv-sil)">${svg}</g>`;
s.push(`<defs><filter id="rv-sil"><feFlood flood-color="#33273B"/><feComposite in2="SourceAlpha" operator="in"/></filter></defs>`);
// a point on a ray from the vanishing point: t = 0 at VP, 1 at the frame edge reference
const R = (x1, y1, t) => [VX + (x1 - VX) * t, VY + (y1 - VY) * t];
const poly = (pts) => 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';

/* ---------- sky slit between the roofs, laundry and wires ---------- */
s.push(K.sky({ w: W, h: 420, phase: 'dusk', zenith: '#6A5CAE', horizon: '#FFB066' }));
s.push(K.cloud({ x: 980, y: 300, w: 520, h: 260, seed: 5, shade: '#C08CA8', light: '#FFD8B0' }));
s.push(K.glow(960, 260, 700, 300, '#FFE2A8', 0.6));
// far trees and a roof beyond the porch
s.push(K.foliage({ x: 820, y: 220, w: 300, h: 200, seed: 61, tones: { dark: '#3F7A5A', mid: '#5E9A62', light: '#9CC67C', hi: '#E8D88A' } }));
s.push(K.foliage({ x: 1120, y: 230, w: 260, h: 190, seed: 62, tones: { dark: '#3F7A5A', mid: '#5E9A62', light: '#9CC67C', hi: '#E8D88A' } }));

/* ---------- the porch at the far end (the Boss's perch) ---------- */
// back wall + sliding door + shelves of boxes
s.push(K.surface({ pts: [[800, 150], [1120, 150], [1120, 392], [800, 392]], color: '#C99A6A', grime: 0.3, tex: 'brush-v', texOpacity: 0.4 }));
s.push(`<g filter="url(#k-rough)"><rect x="840" y="200" width="120" height="150" fill="#F2E4C6"/><path d="M900 200V350M840 250H960M840 300H960" stroke="#8A6248" stroke-width="5"/><rect x="840" y="200" width="120" height="150" fill="none" stroke="#7A5338" stroke-width="6"/>
  <rect x="990" y="300" width="58" height="44" fill="#D8B27E"/><rect x="1052" y="310" width="48" height="36" fill="#C9A06C"/><rect x="1004" y="262" width="50" height="38" fill="#E2C08C"/><path d="M990 322H1048M1004 280H1054" stroke="#9C7650" stroke-width="3"/></g>`);
// eave + roof (with the crown motif on the ridge)
s.push(K.roof({ quad: [[770, 96], [1150, 96], [1196, 158], [724, 158]], rows: 3, cols: 14, color: '#7A6E92' }));
s.push(K.castShadow('M724 158H1196V196H724Z', 0.5));
s.push(`<g filter="url(#k-rough)"><path d="M786 158V392M1134 158V392" stroke="#7A5338" stroke-width="12"/><path d="M786 158V392" stroke="#B28058" stroke-width="4" transform="translate(-3 0)"/></g>`);
// paper lantern
s.push(`<g filter="url(#k-rough)"><path d="M820 160V180" stroke="#5E4A3E" stroke-width="3"/><path d="M800 198Q798 180 820 178Q842 180 840 198Q842 226 820 230Q798 226 800 198Z" fill="#F3E2C4"/><path d="M802 192H838M800 206H840M802 220H838" stroke="#C8A27A" stroke-width="2"/></g>`);
s.push(K.glow(820, 204, 70, 60, '#FFE6B0', 0.5));
// deck + its front face + three steps down
s.push(K.surface({ pts: [[750, 380], [1170, 380], [1186, 400], [734, 400]], color: '#D8B488', grime: 0.1 }));
s.push(K.surface({ pts: [[734, 400], [1186, 400], [1186, 448], [734, 448]], color: '#9C7454', grime: 0.3, tex: 'brush-v', texOpacity: 0.4 }));
const step = (y0, h, x0, x1, c) => K.surface({ pts: [[x0, y0], [x1, y0], [x1 + 14, y0 + 10], [x0 - 14, y0 + 10]], color: '#E4D8C6', grime: 0.05 }) + K.surface({ pts: [[x0 - 14, y0 + 10], [x1 + 14, y0 + 10], [x1 + 14, y0 + h], [x0 - 14, y0 + h]], color: c || '#B8ACA2', grime: 0.2 });
s.push(step(448, 36, 790, 1130) + step(484, 42, 760, 1160) + step(526, 50, 726, 1194));
s.push(K.castShadow('M712 576H1208L1250 600H670Z', 0.4));

/* ---------- the left building: wood facade receding, eave, windows, AC, laundry ---------- */
const LT = [[-40, 20], [742, 230]], LB = [[-40, 1110], [742, 590]];
s.push(K.surface({ pts: [LT[0], LT[1], LB[1], LB[0]], color: '#B88A62', grime: 0.35, tex: 'brush-v', texOpacity: 0.45 }));
// window + sliding shutter in perspective
const lq = (u0, u1, v0, v1) => { const P = (u, v) => [LT[0][0] + (LT[1][0] - LT[0][0]) * u, (LT[0][1] + (LT[1][1] - LT[0][1]) * u) * (1 - v) + (LB[0][1] + (LB[1][1] - LB[0][1]) * u) * v]; return [P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)]; };
s.push(`<g filter="url(#k-rough)"><path d="${poly(lq(0.42, 0.62, 0.22, 0.48))}" fill="#6E7E9E"/><path d="${poly(lq(0.42, 0.62, 0.22, 0.48))}" fill="none" stroke="#6E4A36" stroke-width="7"/><path d="${poly(lq(0.44, 0.5, 0.24, 0.46))}" fill="#D8EAF4" opacity="0.5"/>
  <path d="${poly(lq(0.72, 0.84, 0.3, 0.52))}" fill="#6E7E9E"/><path d="${poly(lq(0.72, 0.84, 0.3, 0.52))}" fill="none" stroke="#6E4A36" stroke-width="5"/></g>`);
s.push(`<g filter="url(#k-rough)"><path d="${poly(lq(0.1, 0.26, 0.2, 0.42))}" fill="#E8E2D4"/><path d="${poly(lq(0.12, 0.24, 0.26, 0.36))}" fill="#BEB6AC"/></g>`); // AC unit
s.push(K.roof({ quad: [[-60, -40], [760, 200], [742, 232], [-40, 34]], rows: 3, cols: 16, color: '#6E7E98' }));
s.push(K.castShadow(poly([[-40, 34], [742, 232], [742, 270], [-40, 120]]), 0.5));
// pots + plants at the facade foot
s.push(K.foliage({ x: 150, y: 860, w: 280, h: 240, seed: 71 }) + K.foliage({ x: 470, y: 690, w: 170, h: 140, seed: 72 }));
s.push(K.prop({ kind: 'pot', x: 470, y: 760, scale: 1.5 }));

/* ---------- the right side: plaster wall, corrugated fence, hedge, laundry pole ---------- */
const RT_ = [[1178, 230], [1960, 30]], RB = [[1178, 590], [1960, 1110]];
s.push(K.surface({ pts: [RT_[0], RT_[1], RB[1], RB[0]], color: '#EBD7BC', grime: 0.3 }));
s.push(K.wall({ quad: [RT_[0], [1560, 132], [1560, 840], RB[0]], color: '#EAD2B6', copingH: 0.05, grime: 0.25 }));
// corrugated metal fence nearer the camera (painted, rusty)
let cor = ''; for (let x = 1600; x < 1960; x += 22) cor += `<path d="M${x} ${132 - (x - 1560) * 0.25}V${880 + (x - 1560) * 0.65}" stroke="#7E8A96" stroke-width="9" opacity="0.6"/><path d="M${x + 6} ${132 - (x - 1560) * 0.25}V${880 + (x - 1560) * 0.65}" stroke="#C4CCD4" stroke-width="5" opacity="0.6"/>`;
s.push(K.surface({ pts: [[1580, 120], [1960, 20], [1960, 1110], [1580, 860]], color: '#9AA4AE', grime: 0.5 }) + `<g filter="url(#k-rough)">${cor}</g>`);
s.push(`<path d="M1580 520L1960 440L1960 1110L1580 860Z" fill="#B0603A" opacity="0.35" filter="url(#k-soft)"/>`);
s.push(K.foliage({ x: 1420, y: 640, w: 300, h: 180, seed: 81 }) + K.foliage({ x: 1290, y: 600, w: 180, h: 110, seed: 82 }) + K.flowers({ x: 1380, y: 700, w: 220, h: 90, seed: 6 }));
s.push(K.prop({ kind: 'bucket', x: 1270, y: 660, scale: 1.1 }));
// laundry line across the slit of sky
s.push(K.wires({ pts: [[742, 120], [1178, 110]], sag: 26, width: 2.5, color: '#6E6382' }) + K.wires({ pts: [[600, 40], [1300, 20]], sag: 40, width: 2, color: '#4A4560' }));
s.push(`<g filter="url(#k-rough)"><path d="M860 136h40v52h-40z" fill="#FFFDF4"/><path d="M920 140h30v38h-30z" fill="#F7C8A8"/><path d="M1040 138h44v58h-44z" fill="#C8DCEC"/></g>`);

/* ---------- the stone path receding to the steps ---------- */
s.push(K.ground({ pts: [[712, 590], [1208, 590], [1960, 1110], [-40, 1110]], color: '#C2B4A0', seed: 8 }));
let slabs = ''; for (let i = 0; i < 9; i++) { const t = Math.pow(1.36, i) * 0.4, y = VY + (1080 - VY) * Math.min(1, t * 0.38) ; }
for (let k = 0; k < 8; k++) { const y = 600 + Math.pow(k / 7, 1.7) * 480, w = 250 + (y - 590) * 1.95; slabs += `<path d="M${960 - w} ${y}H${960 + w}" stroke="#9C8E7C" stroke-width="${2 + k * 0.5}" opacity="0.5"/>`; }
for (let k = -3; k <= 3; k++) slabs += `<path d="M${960 + k * 70} 592L${960 + k * 340} 1110" stroke="#9C8E7C" stroke-width="2.5" opacity="0.4"/>`;
s.push(`<g filter="url(#k-rough)">${slabs}</g>`);
s.push(K.grass({ x1: 712, y1: 596, x2: -40, y2: 1100, n: 30, h: 30, seed: 3, scaleAt: (t) => 0.5 + t * 1.3 }) + K.grass({ x1: 1208, y1: 596, x2: 1960, y2: 1100, n: 30, h: 30, seed: 4, scaleAt: (t) => 0.5 + t * 1.3 }));
// warm light pouring down the alley from the far end + the left building's wisteria shadow
s.push(`<path d="M800 392L1120 392L1700 1110L280 1110Z" fill="#FFF0C8" opacity="0.22" filter="url(#k-soft2)"/>`);
s.push(K.castShadow('M-40 1110L712 596L780 600L360 1110Z', 0.38));
s.push(K.castShadow('M1208 596L1960 880L1960 1110L1500 1110Z', 0.22));

/* ---------- Dusk grade over the set (before the cats) ---------- */
s.push(`<rect width="${W}" height="${H}" fill="#F2A27A" opacity="0.22" style="mix-blend-mode:multiply"/>`);
s.push(K.glow(960, 330, 520, 300, '#FFCF8A', 0.45));
// quiet foreground in the card zone: stones and a plant (no cats here)
s.push(K.foliage({ x: 90, y: 1050, w: 300, h: 150, seed: 91 }));

/* ---------- focus state: TOGEMARU. Related: Daifuku (his Boss, by the arrow), Goma (Rival). Everyone else dims. ---------- */
s.push(`<defs><filter id="rv-dim" x="-20%" y="-20%" width="140%" height="140%"><feFlood flood-color="#6E6AA8" result="f"/><feComposite in="f" in2="SourceAlpha" operator="in" result="fa"/><feComposite in="SourceGraphic" in2="fa" operator="arithmetic" k1="0" k2="0.55" k3="0.45" k4="0"/></filter></defs>`);
const dim = (svg) => `<g filter="url(#rv-dim)" opacity="0.9">${svg}</g>`;
const POS = { daifuku: [960, 386], kagi: [860, 600], ohagi: [1076, 600], goma: [700, 700], togemaru: [1214, 760], sasa: [800, 968], kuri: [1190, 968] };
const [dx, dy] = POS.daifuku;

// arrows: two faint trunks; only Togemaru's branch + the right trunk are bright
const dash = (d, w, op) => `<path d="${d}" fill="none" stroke="${C.cream}" stroke-width="${w + 5}" stroke-linecap="round" opacity="${op}"/><path d="${d}" fill="none" stroke="${C.ink}" stroke-width="${w}" stroke-dasharray="12 10" stroke-linecap="round" opacity="${op}"/>`;
const head = (x, y, ang, w, op) => `<g transform="translate(${x} ${y}) rotate(${ang})" opacity="${op}"><path d="M-14 -10L4 0L-14 10" fill="none" stroke="${C.cream}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 -10L4 0L-14 10" fill="none" stroke="${C.ink}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
s.push(dash('M906 548Q896 480 932 424', 2, 0.35) + head(932, 424, -62, 2, 0.35));                     // left trunk (faint)
s.push(dash('M760 630Q820 570 906 548', 2, 0.35) + dash('M836 548L906 548', 2, 0.35) + dash('M800 870Q820 680 906 548', 2, 0.35));
s.push(dash('M1060 548L1014 548', 2, 0.35) + dash('M1180 880Q1120 680 1014 548', 2, 0.35));           // dim right branches
s.push(dash('M1170 600Q1160 470 1050 440Q1010 430 992 424', 4, 1) + head(992, 424, -165, 4, 1));  // Togemaru's own arrow

// Daifuku (his Boss): full colour, crown on the perch, two steam puffs above
s.push(K.inked(K.blob(K.xf([[-90, 0], [-84, -16], [0, -22], [84, -16], [90, 0], [70, 10], [0, 14], [-70, 10]], { x: dx, y: dy })), '#8E6EB8', 2.5));
s.push(K.cat({ ...RV.CAST.daifuku, pose: 'loaf', expr: 'smug', x: dx, y: dy - 8, scale: 1.6, shadow: false }));
s.push(`<g transform="translate(${dx + 58} ${dy - 118}) rotate(14)">${K.inked('M0 0Q14 -16 30 -10Q21 5 0 0Z', '#7DB857', 2.2)}</g>`);
s.push(`<g transform="translate(${dx} ${dy - 146})">${K.inked('M-26 10L-26 -10L-13 0L0 -18L13 0L26 -10L26 10Z', C.gold, 2.6)}</g>`);
s.push(K.dustCloud({ x: dx - 80, y: dy - 196, r: 22, puffs: 4, seed: 2 }) + K.dustCloud({ x: dx + 84, y: dy - 206, r: 25, puffs: 4, seed: 7 }));

// dimmed: Captains, Sasa, Kuri, and the two unmet silhouettes in the wall shade
s.push(dim(K.cat({ ...RV.CAST.kagi, pose: 'side-walk', expr: 'smug', x: POS.kagi[0], y: POS.kagi[1], scale: 1.0 }) + `<g transform="translate(${POS.kagi[0] + 42} ${POS.kagi[1] - 100}) rotate(-20)">${K.inked('M-4 -14H4V9H-4Z', '#F2D8A0', 1.8)}</g>`));
s.push(dim(K.cat({ ...RV.CAST.ohagi, pose: 'front-sit', x: POS.ohagi[0], y: POS.ohagi[1], scale: 1.1, flip: true })));
s.push(K.castShadow('M520 520L660 516L690 660L500 672Z', 0.5) + K.castShadow('M1310 520L1450 516L1470 660L1300 672Z', 0.5));
s.push(`<g opacity="0.72">${sil(K.cat({ ...RV.CAST.hanpen, pose: 'front-sit', x: 590, y: 640, scale: 0.92, shadow: false }))}${sil(K.cat({ ...RV.CAST.nori, pose: 'front-sit', x: 1380, y: 640, scale: 0.9, shadow: false, flip: true }))}</g>`);
s.push(dim(K.cat({ ...RV.CAST.sasa, pose: 'front-sit', expr: 'happy', carry: 'spring', x: POS.sasa[0], y: POS.sasa[1], scale: 1.55 })));
s.push(dim(K.cat({ ...RV.CAST.kuri, pose: 'side-walk', expr: 'shock', x: POS.kuri[0], y: POS.kuri[1], scale: 1.4, flip: true })));

// Goma (Rival): full colour
s.push(K.cat({ ...RV.CAST.goma, pose: 'loaf', expr: 'angry', x: POS.goma[0], y: POS.goma[1], scale: 1.4 }));

// Togemaru, focused: lifted 4 px, Bell-Gold rim, storm mark on his head aimed at the camera
const tg = { x: POS.togemaru[0], y: POS.togemaru[1] - 4, sc: 1.55 };
s.push(K.shadow({ x: tg.x, y: tg.y + 6, rx: 70, ry: 10, opacity: 0.5 }));
s.push(K.glow(tg.x, tg.y - 90, 150, 140, '#FFF0C0', 0.55));
s.push(RV.hackles({ x: tg.x, y: tg.y, scale: tg.sc, rim: C.gold }));
s.push(RV.notched(K.cat({ ...RV.CAST.togemaru, pose: 'front-sit', expr: 'angry', outline: 'gold', x: tg.x, y: tg.y, scale: tg.sc, flip: true, shadow: false }), [RV.frontNotch(tg.x, tg.y, tg.sc, 'l')], { rim: C.cream }));
s.push(RV.storm({ x: tg.x + 4, y: tg.y - 236, s: 0.85 }));

/* ---------- grade: soft violet edge ---------- */
s.push(`<radialGradient id="vg" cx="0.5" cy="0.42" r="0.75"><stop offset="0.55" stop-color="#6E5AA0" stop-opacity="0"/><stop offset="1" stop-color="#6E5AA0" stop-opacity="0.34"/></radialGradient><rect width="${W}" height="${H}" fill="url(#vg)" style="mix-blend-mode:multiply"/>`);

/* ---------- UI ---------- */
const ink = C.ink, st2 = `stroke="${ink}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const E = {
  stone: `<path d="M-11 9V-4Q-11 -11 0 -11Q11 -11 11 -4V9Z" fill="#C8BEB4" ${st2}/><path d="M-6 0H6" ${st2}/>`,
  lantern: `<path d="M-8 -4Q-9 -11 0 -11Q9 -11 8 -4Q9 7 0 9Q-9 7 -8 -4Z" fill="#E8604A" ${st2}/><path d="M-8 -1H8" ${st2}/>`,
  anchor: `<path d="M0 -11V9M-6 -6H6M-10 2Q-8 9 0 9Q8 9 10 2" fill="none" ${st2}/><circle cy="-11" r="2.6" fill="none" ${st2}/>`,
  lighthouse: `<path d="M-5 10L-3 -6H3L5 10Z" fill="${C.cream}" ${st2}/><path d="M-4 -1H4" stroke="#B8738E" stroke-width="3"/><path d="M-4 -6L0 -11L4 -6Z" fill="#B8738E" ${st2}/>`,
  bus: `<path d="M0 10V-2" ${st2}/><circle cy="-6" r="6.5" fill="${C.cream}" ${st2}/><path d="M-3 -6H3" ${st2}/>`,
  bell: `<circle r="9" fill="${C.gold}" ${st2}/><path d="M-5 2H5M0 2V7" fill="none" ${st2}/><circle cx="-3" cy="-4" r="2" fill="${C.cream}"/>`,
};
const em = (k, haze) => `<span class="em${haze ? ' em--haze' : ''}"><svg width="30" height="30" viewBox="-13 -13 26 26">${E[k]}</svg></span>`;
const dots = (m, h) => `<span class="dots">${'<i class="m"></i>'.repeat(m)}${'<i class="s"></i>'.repeat(h)}</span>`;
const sc = (inner, d) => `<span class="sc">${inner}${d}</span>`;
