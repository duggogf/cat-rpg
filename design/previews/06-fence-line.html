<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat RPG — Frame 06: The Rivals Board (mock screenshot)</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  body { margin: 0; background: #111; }
  /* relationship tags: paper tags hung from the perch (icon + word, 28 px) */
  .rtag { position: absolute; transform: translateX(-50%) rotate(var(--r, -3deg)); display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px 0 8px;
          background: var(--cream); border: 3px solid var(--cocoa); border-radius: 10px 14px 12px 16px; box-shadow: 2px 3px 0 rgba(110,106,168,.55); font: 800 28px/1 var(--font); color: var(--ink); white-space: nowrap; }
  .rtag svg { display: block; }
  .rtag::before { content: ''; position: absolute; left: 50%; top: -9px; width: 10px; height: 10px; border-radius: 50%; background: var(--cream); border: 2.5px solid var(--cocoa); transform: translateX(-50%); }
  .rtag--old { background: #FFE9B0; }
  /* name pills: only the arc lead and the focused cat */
  .pill { position: absolute; transform: translateX(-50%); display: flex; align-items: center; gap: 0; }
  .pill .k-ribbon { height: 42px; font-size: 28px; }
  .pill .sw { display: inline-flex; align-items: center; height: 42px; padding: 0 16px; background: var(--ink); color: var(--cream); font: 800 26px/1 var(--font); border-radius: 0 20px 22px 0; margin-left: -4px; }
  .sign { position: absolute; transform: translateX(-50%) rotate(var(--r, 0deg)); padding: 4px 14px 6px; background: #F4E6CC; border: 3px solid #7A5A44; border-radius: 6px; font: 800 28px/1 var(--font); color: #5A3E2E; white-space: nowrap; }
  .sign--far { font-size: 24px; padding: 2px 10px 4px; opacity: .78; border-width: 2px; }
  /* compact name-card (bottom-left 40%): Sage wedge banner + bean body, shared with frames 02 and 05 */
  #card { left: 28px; top: 800px; width: 880px; height: 254px; padding: 0; overflow: visible; }
  #card .head { position: relative; display: flex; align-items: center; gap: 14px; margin: -30px 0 0 -14px; height: 90px; padding: 0 64px 0 16px; width: max-content; box-sizing: border-box;
    background: var(--sage); color: var(--ink); border: 4px solid var(--ink); border-right: 0; clip-path: polygon(0 0, 100% 0, calc(100% - 40px) 100%, 0 100%); }
  #card .nm { font: 800 44px/1 var(--font); letter-spacing: .02em; }
  #card .tt { font: 700 28px/1.05 var(--font); margin-top: 4px; }
  #card .anger { position: absolute; right: 22px; top: 12px; display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 18px 0 10px; border-radius: 26px 22px 24px 20px; background: var(--recessed); border: 3px solid var(--cocoa); font: 800 28px/1 var(--font); color: var(--ink); }
  #card .body { display: flex; gap: 16px; padding: 4px 24px 0 24px; }
  #card .c1 { display: flex; flex-direction: column; gap: 6px; width: 270px; flex: none; }
  #card .row { display: flex; align-items: center; gap: 8px; font: 700 28px/1.1 var(--font); color: var(--ink); white-space: nowrap; }
  #card .row svg { display: block; flex: none; }
  #card .note { font: 700 24px/1.15 var(--font); color: #6E5A78; white-space: normal; }
  #card .hist { display: flex; flex-direction: column; gap: 2px; border-left: 3px dotted #D9C3A0; padding-left: 18px; }
  #card .hist .row { font-weight: 500; }
  #card .day { font: 800 24px/1 var(--font); color: var(--cocoa); width: 36px; }
  #card .ties { position: absolute; left: 24px; right: 24px; bottom: 14px; display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 3px dotted #D9C3A0; font: 700 28px/1 var(--font); color: var(--ink); white-space: nowrap; }
  #card .ties b { color: var(--cocoa); font-weight: 800; }
  #help { right: 34px; bottom: 28px; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="k-stage" id="stage"></div>
<script src="kit/kit.js"></script>
<script src="rival-helpers.js"></script>
<script>
/* FRAME 06 — THE RIVALS BOARD (key-screens §2; OR-03, OR-04, OR-07). Life 2 day 3, Dusk.
 * Every unique cat in Yunagi on one painted wall, the town climbing left to right: the Lane (Daifuku on his gatepost,
 * his gang in one row in order of discovery, undiscovered silhouettes, a Gone cat's legend card), the uphill districts
 * as hazy silhouettes, the Outsiders gate, and Mikan's Bell fence. No rank ladder.
 * The player is hovering DAIFUKU: Gang tags hang on every discovered Wall Sitter, Old Gang on Hige (from Hige's own
 * Memory); unrelated cats drop to a 40% halftone. Daifuku's anger: two steam puffs (Seething). */
const K = Kit, C = K.C, W = 1920, H = 1080, GY = 1000, WT = 640;
const s = [];
const dim = (svg) => `<g style="filter:saturate(0.25) brightness(1.05)" opacity="0.42">${svg}</g>`;          // 40% halftone (unrelated)
const sil = (svg, haze) => `<g filter="url(#rv-sil${haze ? 'h' : ''})">${svg}</g>`;                          // undiscovered: one flat shape
const silCat = (x, y, sc, haze) => sil(K.cat({ ...RV.CAST.hanpen, pose: 'front-sit', x, y, scale: sc, shadow: false }), haze);
const crown = (x, y, sc, col) => `<path transform="translate(${x} ${y}) scale(${sc})" d="M-16 6L-16 -8L-7 0L0 -13L7 0L16 -8L16 6Z" fill="none" stroke="${col || C.cream}" stroke-width="3" stroke-linejoin="round"/>`;
s.push(`<defs><filter id="rv-sil"><feFlood flood-color="#33273B"/><feComposite in2="SourceAlpha" operator="in"/></filter><filter id="rv-silh"><feFlood flood-color="#5E4E80"/><feComposite in2="SourceAlpha" operator="in"/></filter></defs>`);

/* ---------- Dusk sky ---------- */
s.push(K.sky({ w: W, h: 760, phase: 'dusk', zenith: '#5F55A6', horizon: '#FFB065' }));
s.push(K.glow(900, 560, 1200, 420, '#FFC27A', 0.6));
s.push(RV.sun({ x: 880, y: 548, r: 44 }));
s.push(K.cloud({ x: 380, y: 640, w: 860, h: 560, seed: 7, shade: '#B47EA8', light: '#FFD8B0' }));
s.push(K.cloud({ x: 1800, y: 560, w: 520, h: 380, seed: 11, shade: '#BA84A6', light: '#FFDDB8', opacity: 0.9 }));
s.push(`<g opacity="0.6" filter="url(#k-soft)"><path d="M620 150Q800 132 1000 146" stroke="#FFD2B4" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M1100 110Q1250 98 1440 106" stroke="#FFC9A8" stroke-width="5" fill="none" stroke-linecap="round"/></g>`);

/* ---------- Yunagi climbing the hill to the right, in haze: Arcade, Shiosai, the Summit ---------- */
s.push(RV.duskSea({ x: 0, y: 580, w: 1000, h: 80, sunX: 880 }));
s.push(K.hill({ pts: [[700, 600], [900, 560], [1100, 480], [1300, 380], [1440, 290], [1540, 260], [1700, 300], [1940, 380]], baseY: 760, color: '#957EAC', seed: 4 }));
const hz = (x, y, w, h, c) => `<path d="M${x} ${y + h * 0.35}L${x + w * 0.5} ${y}L${x + w} ${y + h * 0.35}V${y + h}H${x}Z" fill="${c}"/><rect x="${x + w * 0.2}" y="${y + h * 0.55}" width="${w * 0.18}" height="${h * 0.2}" fill="#F0C2A8" opacity="0.7"/>`;
let town = ''; const RT = K.rng(9);
for (let i = 0; i < 40; i++) { const x = 760 + RT() * 1160, ridge = x < 1540 ? 600 - (x - 700) * 0.4 : 260 + (x - 1540) * 0.3; town += hz(x, ridge + 20 + RT() * 60, 34 + RT() * 34, 44 + RT() * 26, RT() > 0.5 ? '#A88EB2' : '#B79CB8'); }
s.push(`<g opacity="0.9">${town}</g>`);
// three short uphill wall stretches, each with a gatepost, sign and authored cats as silhouettes in haze
const far = [];
const stretch = (x0, x1, y, name, sr) => { far.push({ x: x0 + 18, y: y - 54, name, r: sr }); return K.surface({ pts: [[x0, y], [x1, y], [x1, y + 46], [x0, y + 46]], color: '#C8A8BC', grime: 0.1 }) + `<path d="M${x0} ${y - 2}H${x1}V${y + 5}H${x0}Z" fill="#F4CFB0"/><path d="M${x0 + 4} ${y}V${y - 44}H${x0 + 30}V${y}Z" fill="#B898B0"/>`; };
s.push(`<g opacity="0.85">${stretch(1010, 1210, 500, 'Arcade', -3)}${stretch(1210, 1390, 410, 'Shiosai', 2)}${stretch(1400, 1520, 318, 'Summit', -2)}</g>`);
// lighthouse on the summit + Botan on its rail
s.push(`<g><path d="M1556 300L1564 216H1590L1598 300Z" fill="#F4E2DC"/><path d="M1558 252H1596V264H1558Z" fill="#B8738E"/><path d="M1560 216H1594L1577 198Z" fill="#B8738E"/><rect x="1568" y="224" width="18" height="14" fill="#FFF2C0"/><path d="M1546 300H1608" stroke="#8E6E92" stroke-width="5"/></g>`);
s.push(K.glow(1577, 230, 80, 60, '#FFF0C0', 0.6));
const up = [silCat(1100, 500, 0.62, 1), crown(1100, 418, 0.8, '#F4D2B8'), silCat(1170, 500, 0.55, 1), silCat(1300, 410, 0.6, 1), crown(1300, 330, 0.8, '#F4D2B8'), silCat(1460, 318, 0.55, 1), silCat(1610, 300, 0.5, 1), crown(1610, 236, 0.7, '#F4D2B8')];
s.push(`<g opacity="0.8">${up.join('')}</g>`);
s.push(`<rect x="700" y="230" width="1240" height="380" fill="#F3BCA8" opacity="0.14"/>`);

/* ---------- the Lane's own level: roofs and garden trees behind the wall ---------- */
s.push(K.roof({ quad: [[300, 540], [800, 540], [860, 650], [240, 650]], rows: 4, cols: 14, color: '#665C90' }));
s.push(`<path d="M300 540H800V548H300Z" fill="#FFC88E"/>`);
s.push(K.foliage({ x: 980, y: 600, w: 300, h: 160, seed: 23, tones: { dark: '#3E5458', mid: '#5E7656', light: '#9AA05E', hi: '#EBB878' } }));
s.push(K.foliage({ x: 40, y: 420, w: 300, h: 260, seed: 21, tones: { dark: '#3E5458', mid: '#5E7656', light: '#9AA05E', hi: '#EBB878' } }));
s.push(K.wires({ pts: [[-20, 110], [1960, 60]], sag: 110, width: 2.5, color: '#43365A' }));

/* ---------- the lane in front ---------- */
s.push(K.ground({ pts: [[-10, GY - 10], [W + 10, GY - 10], [W + 10, H + 10], [-10, H + 10]], color: '#B4968A', seed: 3 }));

/* ---------- THE LANE WALL: one height, one row (no rank ladder) ---------- */
s.push(K.wall({ quad: [[-20, WT], [1180, WT], [1180, GY], [-20, GY]], color: '#EBCDB4', top: '#F7DCC0', bottom: '#D9AE98', grime: 0.3, copingH: 0.06 }));
s.push(`<rect x="-20" y="${WT - 2}" width="1200" height="14" fill="#FFCF96" opacity="0.55"/><rect x="-20" y="${WT - 2}" width="1200" height="4" fill="#FFF0D0" opacity="0.8"/>`);
s.push(K.castShadow(`M-20 880H1180V1000H-20Z`, 0.28, 'soft2'));
let base = ''; for (let x = -20; x < 1180; x += 46) base += `<path d="M${x} 960h40v40h-40z" fill="#C6A496" opacity="0.5"/>`;
s.push(`<g filter="url(#k-rough)">${base}<path d="M300 700l12 40l-8 30M1060 760l10 30l-8 22" stroke="#A88E98" stroke-width="2.5" fill="none" opacity="0.7"/></g>`);
s.push(K.foliage({ x: 1160, y: 700, w: 120, h: 220, seed: 34, tones: { dark: '#3E5458', mid: '#5E7656', light: '#8FA05E', hi: '#D8B070' } }));
// Daifuku's gatepost: the Boss mark (crown notch carved in its cap)
s.push(K.surface({ pts: [[86, 476], [254, 476], [254, GY], [86, GY]], color: '#E0BCA6', grime: 0.35 }));
s.push(`<g filter="url(#k-rough)"><path d="M76 462H264V482H76Z" fill="#F6DEC0"/><path d="M150 482l10 -12l10 12" stroke="#9C7A70" stroke-width="4" fill="none"/></g>`);
s.push(K.castShadow('M254 482H300V1000H254Z', 0.3));

/* ---------- the Outsiders gate (broken, a torn poster in Scribble) ---------- */
s.push(K.surface({ pts: [[1170, 780], [1470, 780], [1470, GY], [1170, GY]], color: '#C4A0AC', grime: 0.3 }) + `<path d="M1170 778H1470V786H1170Z" fill="#FFCF96" opacity="0.6"/>`);
s.push(K.foliage({ x: 1330, y: 790, w: 300, h: 110, seed: 37, tones: { dark: '#3E5458', mid: '#5E7656', light: '#8FA05E', hi: '#D8B070' } }));
s.push(K.castShadow('M1170 900H1470V1000H1170Z', 0.3));
s.push(`<g filter="url(#k-rough)"><path d="M1196 1000V770H1222V1000Z" fill="#8E6A54"/><path d="M1400 1000V800H1424V1000Z" fill="#8E6A54"/><path d="M1222 800L1330 830L1326 846L1222 818Z" fill="#A27C60"/><path d="M1300 900L1400 870L1400 886L1306 916Z" fill="#A27C60"/>
  <path d="M1228 840H1300V900L1288 892L1276 904L1262 894L1250 906L1228 898Z" fill="#F2E8D6"/><path d="M1238 856q14 -4 26 2t26 -2M1240 874q14 4 34 -2" stroke="#7A6E86" stroke-width="3" fill="none"/></g>`);

/* ---------- the Bell fence: the Lot's fence, the kei truck, Mikan's gatepost ---------- */
s.push(K.surface({ pts: [[1440, 640], [1960, 640], [1960, 820], [1440, 820]], color: '#A68AAE', grime: 0.1 }));
s.push(K.foliage({ x: 1600, y: 700, w: 420, h: 170, seed: 27, tones: { dark: '#3E5458', mid: '#5E7656', light: '#9AA05E', hi: '#EBB878' } }));
s.push(`<g filter="url(#k-rough)"><path d="M1700 690H1960V880H1700Z" fill="#F4ECE0"/><path d="M1720 706H1820V770H1720Z" fill="#8FA7C9"/><path d="M1700 860H1960V900H1700Z" fill="#D9CDBE"/></g>`);
s.push(K.surface({ pts: [[1450, 806], [1940, 806], [1940, GY], [1450, GY]], color: '#B98A5E', grime: 0.3, tex: 'brush-v', texOpacity: 0.45 }));
{ let bd = ''; for (let x = 1450; x < 1940; x += 34) bd += `<path d="M${x} 812V${GY}" stroke="#8E6448" stroke-width="3" opacity="0.6"/><path d="M${x + 4} 812V${GY}" stroke="#D8AE80" stroke-width="2" opacity="0.5"/>`; s.push(`<g filter="url(#k-rough)">${bd}<path d="M1450 840H1940M1450 950H1940" stroke="#8E6448" stroke-width="6" opacity="0.55"/><path d="M1450 806H1940V814H1450Z" fill="#FFCF96" opacity="0.7"/></g>`); }
s.push(K.surface({ pts: [[1496, 716], [1550, 716], [1550, GY], [1496, GY]], color: '#C9A47A', grime: 0.3, tex: 'brush-v', texOpacity: 0.3 }) + `<path d="M1490 702H1556V720H1490Z" fill="#F6E2C0" filter="url(#k-rough)"/>`);

/* ---------- cats ---------- */
// DAIFUKU (hovered): lifted, cream focus rim, two steam puffs (Seething)
const df = { x: 170, y: 470, sc: 2.05 };
s.push(K.glow(df.x, df.y - 80, 190, 140, '#FFF2D0', 0.6));
s.push(`<ellipse cx="${df.x}" cy="${df.y}" rx="140" ry="18" fill="none" stroke="${C.cream}" stroke-width="7"/>`);
s.push(K.cat({ ...RV.CAST.daifuku, pose: 'loaf', expr: 'angry', x: df.x, y: df.y - 4, scale: df.sc }));
s.push(`<g transform="translate(244 326) rotate(14)">${K.inked('M0 0Q16 -18 34 -12Q24 6 0 0Z', '#7DB857', 2.2)}</g>`); // regalia: the leaf
const puff = (x, y, r) => K.dustCloud({ x, y, r, puffs: 4, seed: Math.round(x) }) ;
s.push(puff(92, 250, 24) + puff(250, 232, 28));
s.push(`<g fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"><path d="M100 280q-8 10 0 20q8 10 0 18"/><path d="M244 266q8 10 0 20q-8 10 0 18"/></g>`);
// paw-pad cursor on the hovered cat
s.push(`<g transform="translate(300 420) rotate(-20)">${K.inked(K.ell(0, 8, 17, 14), C.pad, 2.6)}${[[-14, -10], [-5, -17], [5, -17], [14, -10]].map(([x, y]) => K.inked(K.ell(x, y, 5.5, 6.5), C.pad, 2.2)).join('')}</g>`);

// the gang, one row along the wall top in order of discovery
s.push(K.cat({ ...RV.CAST.kagi, pose: 'side-walk', expr: 'smug', outline: 'ink', x: 368, y: WT + 4, scale: 0.92 }));                 // side-eye
s.push(`<g transform="translate(406 ${WT - 92}) rotate(-20)">${K.inked('M-4 -14H4V9H-4Z', '#F2D8A0', 1.8)}</g>`);
s.push(K.cat({ ...RV.CAST.ohagi, pose: 'front-sit', x: 500, y: WT + 4, scale: 1.08 }));                                           // upright nod
s.push(K.cat({ ...RV.CAST.goma, pose: 'loaf', expr: 'angry', x: 610, y: WT + 4, scale: 1.08 }));                                   // glare
s.push(`<g transform="translate(626 ${WT - 104}) scale(1.3)">${K.inked(K.blob(K.pomPts(0, 0, 16, 5, 0.18)), '#6E6382', 2)}<path d="M-8 -2q4 -5 8 0t8 0" stroke="${C.cream}" stroke-width="2.4" fill="none"/></g>`); // grumble
const tg = { x: 728, y: WT + 4, sc: 1.18 };
s.push(RV.hackles({ x: tg.x, y: tg.y, scale: tg.sc, rim: C.sage }));
s.push(RV.notched(K.cat({ ...RV.CAST.togemaru, pose: 'front-sit', expr: 'angry', outline: 'ink', x: tg.x, y: tg.y, scale: tg.sc }), [RV.frontNotch(tg.x, tg.y, tg.sc, 'r')], { rim: C.cream }));
s.push(K.cat({ ...RV.CAST.sasa, pose: 'back', carry: 'spring', x: 846, y: WT + 4, scale: 1.0 }));                                   // yawn, back turned
s.push(`<g transform="translate(846 ${WT + 10}) rotate(-6)"><path d="M-28 -8H28V8H-28Z" fill="#F6E7B8" opacity="0.92"/><path d="M0 -7l2.4 5l5.6 .7l-4 4l1 5.5l-5 -2.6l-5 2.6l1 -5.5l-4 -4l5.6 -.7z" fill="${C.gold}" stroke="${C.ink}" stroke-width="1.5"/></g>`); // tape star: new
s.push(K.cat({ ...RV.CAST.kuri, pose: 'front-sit', expr: 'shock', x: 946, y: WT + 4, scale: 0.98 }));                             // wary
s.push(silCat(1030, WT + 4, 1.0) + silCat(1100, WT + 4, 1.0));                                                                      // not met yet
// legend card: a Gone cat (Chased Off), faded paper card, paw prints off the bottom edge
s.push(`<g transform="translate(1158 ${WT - 30}) rotate(5)" opacity="0.7"><rect x="-30" y="-56" width="60" height="78" rx="6" fill="#F2E4CA" stroke="#9C8478" stroke-width="2.5"/><g transform="translate(0 6) scale(0.45)" opacity="0.6">${K.cat({ ...RV.CAST.hanpen, pose: 'front-sit', x: 0, y: 30, scale: 1, shadow: false })}</g></g>`);
s.push(RV.pawPrints({ pts: [[1150, 700], [1166, 760], [1150, 820], [1168, 880], [1152, 940], [1170, 1010], [1154, 1066]], s: 0.9, opacity: 0.45 }));

// the arc lead's storm mark, aimed at Mikan's gatepost
s.push(RV.storm({ x: tg.x + 4, y: tg.y - 206, s: 1.0, aim: [1486, 650] }));

// Outsiders: a challenger not met yet, staking Laundry Pole Yard
s.push(dim(silCat(1310, GY + 6, 1.05) + `<g transform="translate(1370 ${GY - 40})"><path d="M0 0V-46" stroke="${C.ink}" stroke-width="3"/><path d="M0 -46L26 -38L0 -30Z" fill="${C.cream}" stroke="${C.ink}" stroke-width="2.4"/></g>`));

// Bell fence: Mikan on the gatepost, Crew on the fence. Hige is related (Old Gang); the rest drop to halftone
s.push(dim(K.cat({ ...K.CAST.mikan, pose: 'front-sit', expr: 'happy', x: 1523, y: 704, scale: 1.05 })));
s.push(K.cat({ ...K.CAST.oldWallCat, pose: 'loaf', collar: 'cord', x: 1636, y: 810, scale: 1.05 }));
s.push(dim(K.cat({ ...K.CAST.goofball, pose: 'front-sit', collar: 'cord', x: 1760, y: 810, scale: 1.0, flip: true })));
s.push(dim(K.cat({ ...K.CAST.fraidy, pose: 'front-sit', collar: 'cord', expr: 'neutral', x: 1862, y: 810, scale: 0.98 })));

/* ---------- chalk threads from the hovered cat to every related cat ---------- */
const related = [[368, 676], [500, 728], [610, 676], [728, 728], [846, 676], [946, 728], [1636, 864]];
s.push(related.map(([x, y]) => { const sx = 210, sy = 420, mx = (sx + x) / 2, my = Math.min(sy, y) - 70; return `<path d="M${sx} ${sy}Q${mx} ${my} ${x} ${y - 22}" fill="none" stroke="${C.cream}" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round" opacity="0.75"/>`; }).join(''));

/* ---------- grade ---------- */
s.push(`<rect width="${W}" height="${H}" fill="#FFB070" opacity="0.07" style="mix-blend-mode:multiply"/>`);

/* ---------- UI ---------- */
const ink = C.ink, st2 = `stroke="${ink}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const pawRow = (bell) => `<svg width="${bell ? 52 : 40}" height="26" viewBox="${bell ? -26 : -20} -13 ${bell ? 52 : 40} 26">${[-12, 0, 12].map((x) => `<ellipse cx="${x}" cy="4" rx="5" ry="4.2" fill="${C.pad}" ${st2}/><circle cx="${x - 3.5}" cy="-3.5" r="2.4" fill="${C.pad}" ${st2}/><circle cx="${x + 3.5}" cy="-3.5" r="2.4" fill="${C.pad}" ${st2}/>`).join('')}${bell ? `<circle cx="22" cy="2" r="6" fill="${C.gold}" ${st2}/>` : ''}</svg>`;
const tag = (x, y, word, old, r) => `<div class="rtag ${old ? 'rtag--old' : ''}" style="left:${x}px;top:${y}px;--r:${r || -3}deg">${pawRow(old)}${word}</div>`;
const puffs = (n) => `<svg width="64" height="30" viewBox="0 0 64 30">${[0, 1, 2].map((i) => `<circle cx="${12 + i * 20}" cy="15" r="9" fill="${i < n ? C.cream : 'none'}" stroke="${i < n ? ink : '#B8A890'}" stroke-width="2.5" stroke-dasharray="${i < n ? '' : '3 3'}"/>`).join('')}</svg>`;
const stp = (g, c) => RV.stamp(g, { size: 40, color: c || C.recessed });
