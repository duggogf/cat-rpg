/* FRAME 10 — HOME, EVENING ("A Tuesday in Life 2", narrative §3.8 B, shots 9–10).
 * The pause in the music. Haru stops the Piece, leaves one hand resting on the keys, and her other
 * hand comes down slowly, palm-down, toward Mikan (art bible §5.5: hands are the faces). Mikan sits on
 * the floorboards at her feet, slow-blinking up at it. Low Dusk light from the veranda glass lies
 * across the boards and across Mikan; the rest of the room is cool and quiet. Gran's plum slippers
 * have stopped in the far doorway. No VFX, no glow shapes, no text, no HUD (hud.md §5.1).
 * Camera: Home rig at cat height, 0.3 m over the floorboards (camera §3.9, art bible §6.3).
 * Ink only what acts: Haru, Mikan, the piano lid and keys. Room, furniture and floor are painted.
 * Perspective: horizon y=560 (eye 0.3 m), focal 1100 px, centre x=820. X right, Y up, d away (m). */
const K = Kit, C = K.C, W = 1920, H = 1080, HZ = 560, F = 1100, CX = 820, EYE = 0.3;
const P = (X, Y, d) => [CX + X * F / d, HZ - (Y - EYE) * F / d];
const pd = (pts) => 'M' + pts.map((p) => { const q = P(...p); return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('L') + 'Z';
const G = { lw: 2.5, ol: K.OUTLINES.ink };
let _pid = 0;
/** Painted, unlined surface: vertical gradient + brush grain + hand wobble (E-1/E-2). */
const paint = (pts, color, o) => { o = o || {}; const q = pts.map((p) => P(...p)); const ys = q.map((p) => p[1]), xs = q.map((p) => p[0]);
  const y0 = Math.min(...ys), y1 = Math.max(...ys), x0 = Math.min(...xs), x1 = Math.max(...xs), id = 'pg' + (++_pid), d = pd(pts);
  const g = `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${y0}" x2="0" y2="${y1}"><stop offset="0" stop-color="${o.top || K.mix(color, '#FFFFFF', 0.12)}"/><stop offset="0.55" stop-color="${color}"/><stop offset="1" stop-color="${o.bottom || K.mix(color, '#2A2040', 0.2)}"/></linearGradient>`;
  return `<g filter="url(#k-rough)">${g}<path d="${d}" fill="url(#${id})"/>${K.clipTo(d, K.texture(x0 - 10, y0 - 10, x1 - x0 + 20, y1 - y0 + 20, o.tex || 'brush', o.texOpacity == null ? 0.2 : o.texOpacity) + K.texture(x0 - 10, y0 - 10, x1 - x0 + 20, y1 - y0 + 20, 'grain', 0.12))}</g>`; };
const s = [];
const LW = -1.45, RW = 1.35, BW = 4.2;   // left wall, right wall (X), back wall (d)

/* =============================== the room, painted =============================== */
s.push(`<rect width="${W}" height="${H}" fill="#3A3458"/>`);
// back wall: plaster above a wood wainscot, in cool dusk shade
s.push(paint([[LW, 2.6, BW], [RW, 2.6, BW], [RW, 0.9, BW], [LW, 0.9, BW]], '#9A8AA6', { top: '#7C6E92', bottom: '#AE9AAE' }));
s.push(paint([[LW, 0.9, BW], [RW, 0.9, BW], [RW, 0, BW], [LW, 0, BW]], '#5E4458', { tex: 'brush-v', texOpacity: 0.3 }));
// the far doorway: the kitchen beyond is lit, warm; Gran's plum slippers have stopped on the sill
const dX0 = -0.85, dX1 = -0.1;
s.push(`<path d="${pd([[dX0, 1.85, BW], [dX1, 1.85, BW], [dX1, 0, BW], [dX0, 0, BW]])}" fill="#E8A866"/>`);
s.push(`<path d="${pd([[dX0, 1.85, BW + 1.2], [dX1, 1.85, BW + 1.2], [dX1, 0, BW + 1.2], [dX0, 0, BW + 1.2]])}" fill="#F6C384"/>`);
s.push(`<path d="${pd([[dX0, 0, BW], [dX1, 0, BW], [dX1, 0, BW + 1.2], [dX0, 0, BW + 1.2]])}" fill="#D99A5C"/>`);
s.push(`<path d="${pd([[dX0 - 0.06, 1.92, BW], [dX1 + 0.06, 1.92, BW], [dX1 + 0.06, 1.85, BW], [dX0 - 0.06, 1.85, BW]])}" fill="#4A3040"/>` + `<path d="${pd([[dX0 - 0.06, 1.85, BW], [dX0, 1.85, BW], [dX0, 0, BW], [dX0 - 0.06, 0, BW]])}" fill="#4A3040"/><path d="${pd([[dX1, 1.85, BW], [dX1 + 0.06, 1.85, BW], [dX1 + 0.06, 0, BW], [dX1, 0, BW]])}" fill="#4A3040"/>`);
// noren hanging in the doorway to knee height (plain, no writing)
s.push(`<g filter="url(#k-rough)"><path d="${pd([[dX0, 1.84, BW - 0.01], [(dX0 + dX1) / 2 - 0.01, 1.84, BW - 0.01], [(dX0 + dX1) / 2 - 0.02, 0.9, BW - 0.01], [dX0, 0.93, BW - 0.01]])}" fill="#3E5384"/><path d="${pd([[(dX0 + dX1) / 2 + 0.01, 1.84, BW - 0.01], [dX1, 1.84, BW - 0.01], [dX1, 0.92, BW - 0.01], [(dX0 + dX1) / 2 + 0.02, 0.9, BW - 0.01]])}" fill="#364A78"/></g>`);
// Gran, beneath the noren: ankles, the plum cross-hatched hem, plum slippers turned toward the piano
{ const k = F / (BW - 0.05) / 330; const leg = (x) => K.inked(pd([[x - 0.045, 0.62, BW - 0.05], [x + 0.045, 0.62, BW - 0.05], [x + 0.04, 0.06, BW - 0.05], [x - 0.04, 0.06, BW - 0.05]]), '#C9B4A4', 1.8);
  s.push(leg(-0.6) + leg(-0.38));

  s.push(slip(-0.6, 6) + slip(-0.37, 10));
  s.push(K.celGroup({ parts: [{ d: pd([[-0.72, 0.92, BW - 0.06], [-0.24, 0.92, BW - 0.06], [-0.24, 0.6, BW - 0.06], [-0.72, 0.6, BW - 0.06]]), fill: '#8E4A7B' }], shade: pd([[-0.4, 0.92, BW - 0.06], [-0.24, 0.92, BW - 0.06], [-0.24, 0.6, BW - 0.06], [-0.4, 0.6, BW - 0.06]]) }, { lw: 1.8, ol: K.OUTLINES.ink }));
  let hatch = ''; for (let i = 0; i < 8; i++) { const a = P(-0.7 + i * 0.06, 0.68, BW - 0.06); hatch += `M${a[0]} ${a[1]}l6 9M${a[0] + 6} ${a[1]}l-6 9`; } s.push(`<path d="${hatch}" stroke="#B070A0" stroke-width="1.5" opacity="0.8"/>`); }

{ const a = P(LW, 0.5, 2.6); s.push(K.glow(a[0] + 10, a[1] - 10, 150, 120, '#FFE2A8', 0.9)); }                      // the low sun

{ const q = [[LW, 0.55, 2.55], [LW, 0.82, 2.62], [LW, 1.0, 2.8], [LW, 1.06, 3.05], [LW, 0.98, 3.3], [LW, 0.86, 3.5], [LW, 0.7, 3.7], [LW, 0.55, 3.85]].map((p) => P(...p)); s.push(`<path d="${K.blob(q, true, 0.5)}" fill="#4E4680" filter="url(#k-leaf)"/>`); }

{ const a = P(LW - 0.4, 1.7, 2.1); s.push(K.glow(a[0], a[1], 50, 50, '#FFD98A', 0.9) + `<circle cx="${a[0]}" cy="${a[1]}" r="6" fill="#FFF0C0"/>`); }

{ let b = ''; for (let i = 0; i <= 18; i++) { const X = LW + i * 0.155, a = P(X, 0, BW), c = P(X, 0, 0.55); b += `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}" stroke="#4E3A50" stroke-width="2" opacity="0.45"/><path d="M${(a[0] + 2).toFixed(1)} ${a[1].toFixed(1)}L${(c[0] + 5).toFixed(1)} ${c[1].toFixed(1)}" stroke="#C9967A" stroke-width="1.6" opacity="0.25"/>`; }
  const R = K.rng(8); for (let k = 0; k < 16; k++) { const X = LW + Math.floor(R() * 18) * 0.155, d = 0.8 + R() * 3.2, a = P(X, 0, d), c = P(X + 0.155, 0, d); b += `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}" stroke="#4E3A50" stroke-width="1.6" opacity="0.4"/>`; }
  s.push(`<g filter="url(#k-rough)">${b}</g>`); }
s.push(`<path d="${pd([[LW, 0.06, BW - 0.01], [RW, 0.06, BW - 0.01], [RW, 0, BW - 0.01], [LW, 0, BW - 0.01]])}" fill="#3E2E40"/>`);

/* right wall + the upright piano against it, keyboard facing us-left (painted case; lid and keys inked) */

s.push(`<path d="${pd([[PF - 0.041, 0.5, PZ0 + 0.2], [PF - 0.041, 0.5, PZ1 - 0.15], [PF - 0.041, 0.14, PZ1 - 0.15], [PF - 0.041, 0.14, PZ0 + 0.2]])}" fill="none" stroke="#6A4250" stroke-width="3" opacity="0.7"/>`);
// the keybed slab under the keys
s.push(paint([[KF - 0.03, 0.7, PZ0], [KF - 0.03, 0.7, PZ1], [KF - 0.03, 0.62, PZ1], [KF - 0.03, 0.62, PZ0]], '#5E3A3A', { tex: 'brush', texOpacity: 0.2 }));
// legs at the treble and bass ends

// music stand + the Scribble score with a pencil circle on one bar
{ const sp = [[PF - 0.05, 1.12, 1.45], [PF - 0.05, 1.12, 2.15], [PF - 0.11, 0.84, 2.15], [PF - 0.11, 0.84, 1.45]];
  s.push(K.inked(pd(sp), '#F4EAD8', 2));
  let sm = ''; const R = K.rng(17);
  for (let r = 0; r < 7; r++) { const y = 1.08 - r * 0.033; let d = 1.5; while (d < 2.1) { const l = 0.03 + R() * 0.07, a = P(PF - 0.06 - r * 0.008, y, d), b = P(PF - 0.06 - r * 0.008, y, Math.min(2.12, d + l)); sm += `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}" stroke="#8C8098" stroke-width="1.4" stroke-linecap="round"/>`; d += l + 0.02; } }
  const pc = P(PF - 0.08, 1.0, 1.75); sm += `<ellipse cx="${pc[0]}" cy="${pc[1]}" rx="12" ry="9" fill="none" stroke="#8C8098" stroke-width="1.8"/>`;
  s.push(sm); }
// fallboard (open), keys: inked — the only inked parts of the piano (L-1)
s.push(K.inked(pd([[PF - 0.13, 0.83, PZ0 + 0.07], [PF - 0.13, 0.83, PZ1 - 0.07], [PF - 0.15, 0.745, PZ1 - 0.07], [PF - 0.15, 0.745, PZ0 + 0.07]]), '#4A2A2E', 2));
const KZ0 = PZ0 + 0.08, KZ1 = PZ1 - 0.08, NW = 30, kw = (KZ1 - KZ0) / NW, KY = 0.72;
let keys = K.inked(pd([[KF, KY, KZ0], [KF, KY, KZ1], [KF - 0.02, KY - 0.02, KZ1], [KF - 0.02, KY - 0.02, KZ0]]), '#E6DCEA', 2) + K.inked(pd([[KF, KY, KZ0], [PF - 0.15, KY, KZ0], [PF - 0.15, KY, KZ1], [KF, KY, KZ1]]), '#FBF6EE', 2);
for (let i = 1; i < NW; i++) { const d = KZ0 + i * kw, a = P(KF - 0.02, KY - 0.02, d), b = P(KF, KY, d), c = P(PF - 0.15, KY, d); keys += `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}" stroke="${C.ink}" stroke-width="1.1" fill="none"/>`; }
const BK = [1, 1, 0, 1, 1, 1, 0];
for (let i = 0; i < NW - 1; i++) { if (!BK[i % 7]) continue; const d = KZ0 + (i + 1) * kw; keys += K.inked(pd([[KF + 0.05, KY + 0.012, d - kw * 0.3], [KF + 0.05, KY + 0.012, d + kw * 0.3], [PF - 0.15, KY + 0.012, d + kw * 0.3], [PF - 0.15, KY + 0.012, d - kw * 0.3]]), '#2A2230', 1.2); }
s.push(keys);
// shadow pooled under the piano (Shadow Wisteria, never grey)
s.push(K.castShadow(pd([[PF - 0.3, 0, PZ0], [RW, 0, PZ0], [RW, 0, PZ1 + 0.2], [PF - 0.3, 0, PZ1 + 0.2]]), 0.5, 'soft2'));
// the pedals, brass, catching a little light
[1.38, 1.48, 1.58].forEach((d) => s.push(K.inked(pd([[KF - 0.02, 0.07, d - 0.025], [KF - 0.02, 0.07, d + 0.025], [KF - 0.14, 0.06, d + 0.02], [KF - 0.14, 0.06, d - 0.02]]), '#C99A4A', 1.6)));

/* the piano bench (painted wood), Haru sitting side-on to us; we look up at its underside */
const BX0 = -0.32, BX1 = 0.24, BD0 = 1.15, BD1 = 1.55, BY = 0.47;
s.push(K.castShadow(pd([[BX0 - 0.1, 0, BD0 - 0.05], [BX1 + 0.1, 0, BD0 - 0.05], [BX1 + 0.35, 0, BD1 + 0.2], [BX0 + 0.1, 0, BD1 + 0.2]]), 0.5, 'soft2'));
const benchLeg = (x, d) => paint([[x - 0.025, BY - 0.05, d], [x + 0.025, BY - 0.05, d], [x + 0.025, 0, d], [x - 0.025, 0, d]], '#5A3A44', { tex: 'brush-v', top: '#6E4A4C', bottom: '#3E2838' });
s.push(benchLeg(BX0 + 0.04, BD1 - 0.04) + benchLeg(BX1 - 0.04, BD1 - 0.04));
s.push(paint([[BX0, BY - 0.05, BD0], [BX1, BY - 0.05, BD0], [BX1, BY - 0.05, BD1], [BX0, BY - 0.05, BD1]], '#3E2A3C', { top: '#4A3242', bottom: '#33243A' }));   // underside, in shade

/* =============================== Haru: legs, hem, hands (inked cels, hand-drawn on the projected anchors) =============================== */
const HP = { skin: '#F6D2B0', card: C.haru, cardS: '#E9B428', skirt: '#4E6A9A', sock: C.haru };
// far (right) leg: shin to the foot resting on the soft pedal
s.push(K.celGroup({ parts: [{ d: K.tube([[1170, 372], [1196, 560], [1214, 706]], [56, 48, 36], { capRound: 0.5 }), fill: HP.skin }], shadeAll: true }, G));
s.push(K.celGroup({ parts: [{ d: K.tube([[1210, 664], [1214, 712]], [40, 38], { capRound: 0.4 }), fill: HP.sock }, { d: 'M1194 704C1220 696 1260 700 1296 712C1310 718 1306 732 1292 734C1260 736 1222 734 1196 728Z', fill: HP.sock }], shadeAll: true }, G));
// near leg: knee, shin, yellow sock, foot flat on the boards
s.push(K.celGroup({ parts: [{ d: K.tube([[1112, 390], [1140, 580], [1160, 740]], [70, 60, 44], { capRound: 0.5 }), fill: HP.skin }], shade: K.tube([[1088, 400], [1118, 580], [1142, 740]], [20, 16, 12]), lines: ['M1136 410Q1146 426 1140 444'] }, G));
s.push(K.celGroup({ parts: [{ d: K.tube([[1156, 690], [1162, 748]], [48, 46], { capRound: 0.4 }), fill: HP.sock }, { d: 'M1134 742C1164 730 1214 734 1258 750C1274 756 1272 774 1254 776C1214 780 1170 778 1136 770Z', fill: HP.sock }], shade: 'M1130 760C1180 766 1230 768 1276 764V790H1130Z', lines: ['M1146 744Q1166 750 1184 744'] }, G));

s.push(K.celGroup({ parts: [{ d: K.tube([[1188, 218], [1216, 236]], [74, 70], { capRound: 0.2 }), fill: HP.cardS }] }, G));

  shade: K.tube([[918, -40], [912, 110], [880, 260], [846, 372]], [40, 40, 36, 30]), lines: ['M884 170Q866 196 874 226', 'M852 286Q838 306 846 330'] }, G));

// the hand: open, palm-down, slowing just above Mikan's head — back of the hand toward us, fingers soft
