<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat RPG — Frame 08: Turf Board (mock screenshot)</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  body { margin: 0; background: #111; }
  /* ONE type scale: 44 header · 32 body/emphasis · 28 floor (kit .k-h/.k-body/.k-small). ONE edge grid: x 36 | 1276/1300 | 1884; y 20–96 | 112–812 | 828–996 | 1020; gutters 16/24. */
  .hdr { left: 36px; top: 20px; width: 1848px; height: 76px; padding: 0 22px 0 26px; display: flex; align-items: center; gap: 22px; }
  .hdr .k-h { white-space: nowrap; }
  .infl { display: flex; align-items: center; gap: 12px; flex: 1; }
  .bar { position: relative; flex: 1; height: 34px; border: var(--frame) solid var(--ink); border-radius: 18px 20px 17px 21px; background: var(--recessed); overflow: hidden; }
  .bar .gold { position: absolute; left: 0; top: 0; bottom: 0; width: 82%; background: var(--gold); border-right: var(--frame) solid var(--ink); }
  .bar .fade { position: absolute; left: 82%; top: 0; bottom: 0; width: 6%; background: repeating-linear-gradient(-55deg, var(--gold) 0 6px, var(--recessed) 6px 11px); border-right: 2px dashed var(--ink); }
  .bar .open { position: absolute; left: 88%; right: 0; top: 0; bottom: 0; }
  .pct { font: 800 32px/1 var(--font); color: var(--ink); min-width: 74px; text-align: right; }
  .tabs { display: flex; align-items: center; gap: 8px; }
  .tab { height: 48px; padding: 0 20px; display: inline-flex; align-items: center; gap: 8px; border-radius: 26px 24px 27px 23px; font: 800 28px/1 var(--font); color: var(--cocoa); }
  .tab.on { background: var(--cocoa); color: var(--cream); }
  .sh { min-width: 48px; height: 44px; font-size: 22px; padding: 0 8px; }

  /* Patch stamp: landmark in a bean, owner ring, wisps, ONE badge, the seated Sentry */
  .stamp { position: absolute; width: 112px; height: 104px; transform: translate(-50%, -50%); }
  .stamp .bean { position: absolute; inset: 0; background: var(--cream); border: 6px solid var(--k-ring, var(--gold)); outline: 3px solid var(--ink); border-radius: 46px 52px 44px 54px / 50px 44px 54px 46px; box-shadow: var(--drop); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .stamp.sage { --k-ring: var(--sage); }
  .stamp.sel .bean { box-shadow: 0 0 0 9px rgba(255, 246, 227, .9), 0 0 0 12px var(--gold), var(--drop); }
  .stamp .badge { position: absolute; right: -16px; top: -18px; }
  .stamp .seat { position: absolute; right: -40px; bottom: -26px; }
  .stamp .empty { width: 58px; height: 58px; border: 3px dashed var(--cream); border-radius: 50%; background: rgba(51, 39, 59, .25); }
  .pname { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 10px); white-space: nowrap; }
  .pname.k-pill { height: 36px; font-size: 28px; padding: 0 14px; }

  /* Tonight panel */
  .ton { left: 1300px; top: 112px; width: 584px; height: 700px; padding: 22px 28px 24px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; font: 500 28px/1.2 var(--font); color: var(--ink); white-space: nowrap; }
  .lab { font: 700 28px/1 var(--font); color: var(--cocoa); width: 112px; flex: none; }
  .em { font: 800 32px/1 var(--font); color: var(--ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  .chip .k-ribbon { height: 40px; font-size: 28px; padding: 0 26px 0 14px; }
  .rule { border-top: 3px dotted rgba(107, 74, 53, .45); margin: 4px 0; }
  .odds { display: flex; height: 30px; border: var(--frame) solid var(--ink); border-radius: 16px 18px 15px 19px; overflow: hidden; }
  .odds i { display: block; height: 100%; }
  .odds .r { width: 68%; background: var(--nerve); border-right: var(--frame) solid var(--ink); }
  .odds .s { width: 26%; background: repeating-linear-gradient(-55deg, var(--recessed) 0 6px, var(--cocoa) 6px 8.5px); border-right: var(--frame) solid var(--ink); }
  .odds .l { width: 6%; background: var(--sage); }
  .oddlab { display: flex; font: 700 28px/1 var(--font); color: var(--cocoa); }
  .oddlab span:nth-child(1) { width: 68%; } .oddlab span:nth-child(2) { width: 26%; }
  .go { margin-top: auto; justify-content: center; width: 100%; height: 72px; font-size: 32px; gap: 14px; }

  /* Crew strip */
  .strip { left: 36px; top: 828px; width: 1848px; height: 168px; padding: 0 30px; display: flex; align-items: center; gap: 18px; }
  .pegs { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; width: 150px; flex: none; }
  .cat { display: flex; align-items: center; gap: 10px; width: 268px; flex: none; }
  .cat .tx { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .cat .k-ribbon { height: 40px; font-size: 28px; padding: 0 26px 0 14px; }
  .cat .k-pill { height: 36px; font-size: 28px; padding: 0 14px; white-space: nowrap; }
  .cat.carry { opacity: .55; }
  .div { width: 0; align-self: stretch; margin: 22px 0; border-left: 3px dotted rgba(107, 74, 53, .45); }
  .tot { margin-left: auto; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .foot { left: 36px; top: 1020px; display: flex; gap: 16px; }
  .foot .k-prompt { padding: 4px 18px 4px 6px; }
</style>
</head>
<body>
<div class="k-stage" id="stage"></div>
<script src="kit/kit.js"></script>
<script src="rival-helpers.js"></script>
<script>
/* FRAME 08 — THE TURF BOARD, unified (key-screens.md §5, OR-17). Life 2 day 3, the Lot at Dusk.
 * Four zones, read in one Z: HEADER (how am I doing: Hidamari Lane, influence 88%, the crown) →
 * MAP (where: five Patch stamps, no numbers, one badge each; Persimmon Alley lit, a raid tonight) →
 * TONIGHT (what: Togemaru + a Stray come for it; Hige is being carried onto it; one button) →
 * CREW STRIP (who: Sentry pegs, four cat chips, the totals). Numbers live only in the header %,
 * the Tonight panel and the totals. Togemaru/Kagi drawn from rival-helpers.js.
 * Influence (OR-08): LWC 25 + LPY 25 + PA 48/60×25=20 + TSS 42/60×25≈18 = 88. */
const K = Kit, C = K.C, W = 1920, H = 1080;
const s = [];
const MX0 = 36, MY0 = 112, MX1 = 1276, MY1 = 812;     // the map board (≈ 65% width)
const SX = (MX1 - MX0) / 1280, SY = (MY1 - MY0) / 690, fx = (x) => MX0 + (x - 36) * SX, fy = (y) => MY0 + (y - 116) * SY;  // design space → board
/* ---------- personality pictograms (frame-local; pom-backed, Ink line) ---------- */
const PERS = {
  Stalwart: (st) => `<path d="M0 -15L13 -10V0Q13 11 0 16Q-13 11 -13 0V-10Z" fill="#9FB6D8" ${st}/><path d="M0 -10V11" fill="none" ${st}/>`,
  Goofball: (st) => `<circle r="13" fill="#F6809A" ${st}/><path d="M-12 -4Q0 2 12 -5M-9 7Q0 0 9 9M-4 -12Q2 0 -2 12" fill="none" ${st}/>`,
  Fraidy: (st) => `<path d="M-4 -15Q-8 -2 -4 4Q-1 -2 -4 -15Z" fill="${C.cream}" ${st}/><circle cx="-4" cy="11" r="2.6" fill="${C.ink}"/><path d="M7 -12Q3 0 7 5Q10 0 7 -12Z" fill="${C.cream}" ${st}/><circle cx="7" cy="11" r="2.6" fill="${C.ink}"/>`,
  Schemer: (st) => `<path d="M-15 2Q0 -12 15 2Q0 10 -15 2Z" fill="${C.cream}" ${st}/><path d="M0 -5Q-3 2 0 8Q3 2 0 -5Z" fill="${C.ink}"/><path d="M-14 -9L-6 -6M14 -9L6 -6" fill="none" ${st}/>`,
  Braggart: (st) => `<path d="M-14 8L-12 -10L-5 -2L0 -14L5 -2L12 -10L14 8Z" fill="${C.gold}" ${st}/>`,
  Brooder: (st) => `<path d="M-13 6Q-15 -6 -5 -7Q-2 -15 6 -11Q15 -10 13 0Q16 8 6 8Z" fill="#B7A9CF" ${st}/><path d="M-6 13l-2 4M2 13l-2 4" fill="none" ${st}/>`,
};
const pIcon = (name, size = 40, bg = C.cream) => {
  const st = `stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
  return `<svg viewBox="-22 -22 44 44" width="${size}" height="${size}" style="display:block;flex:none"><circle r="20" fill="${bg}" stroke="${C.cocoa}" stroke-width="3"/>${PERS[name](st)}</svg>`;
};
const fishIco = (size = 30) => K.ui.icon({ name: 'fish', size });
const bellIco = (size = 30) => K.ui.icon({ name: 'bell', size });
const brickIco = (size = 30) => K.ui.icon({ name: 'brick', size });
const shieldIco = (size = 32) => `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" style="display:block;flex:none"><path d="M0 -16L14 -10V0Q14 12 0 17Q-14 12 -14 0V-10Z" fill="${C.gold}" stroke="${C.ink}" stroke-width="2.6" stroke-linejoin="round"/><path d="M-6 0l4 5l9 -10" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const moonIco = (size = 30) => `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" style="display:block;flex:none"><path d="M6 -15A16 16 0 1 0 15 7A12 12 0 1 1 6 -15Z" fill="#EAF0FF" stroke="${C.ink}" stroke-width="2.6" stroke-linejoin="round"/></svg>`;
const heartIco = (size = 30) => K.ui.icon({ name: 'heart', size });
const clawX = (size = 30) => `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" style="display:block;flex:none"><circle r="18" fill="${C.cream}" stroke="${C.ink}" stroke-width="2.5"/><path d="M-9 -10Q-2 -2 9 10M-3 -12Q2 -4 12 4M9 -10Q2 -2 -9 10M3 -12Q-2 -4 -12 4" fill="none" stroke="${C.ink}" stroke-width="2.6" stroke-linecap="round"/></svg>`;

/* ---------- the Crew (kit CAST looks; names per crew-and-progression.md §3.3) ---------- */
const CREW = {
  hige: { name: 'Hige', pers: 'Stalwart', cat: { ...K.CAST.oldWallCat, carry: 'post', expr: 'neutral' } },
  pon: { name: 'Pon', pers: 'Goofball', cat: { ...K.CAST.goofball } },
  kinako: { name: 'Kinako', pers: 'Fraidy', cat: { ...K.CAST.fraidy } },
  kagi: { name: 'Kagi', pers: 'Schemer', cat: { ...RV.CAST.kagi } },
};
const TOGE = { ...RV.CAST.togemaru, expr: 'angry' };   // the Nemesis: same design as frames 05–06
const portrait = (cat, size, ring) => K.ui.portrait({ cat, size, ring: ring || C.cocoa });
/* =====================================================================================
 * 1. THE LOT'S PLANK FENCE AT DUSK (backdrop for the whole screen)
 * ===================================================================================== */
s.push(`<rect width="${W}" height="${H}" fill="#7A5238"/>`);
s.push(K.fence({ quad: [[-20, -10], [W + 20, -10], [W + 20, H + 10], [-20, H + 10]], n: 22, seed: 9, color: '#B98654', rail: false, gap: 0.05 }));
s.push(`<rect x="-20" y="2000" width="${W + 40}" height="40" fill="#8A5E3E" filter="url(#k-rough)"/><rect x="-20" y="2000" width="${W + 40}" height="8" fill="#E8B880" opacity="0.6" filter="url(#k-rough)"/>`);
// dusk light raking across the boards from the left, with a warm pool behind the map
s.push(K.glow(260, 60, 1100, 640, '#FFC27A', 0.55) + K.glow(1500, 980, 900, 380, '#F7A45A', 0.25));
s.push(`<rect width="${W}" height="${H}" fill="#7A4E8C" opacity="0.16" style="mix-blend-mode:multiply"/>`);
// knot holes and a few nail heads
s.push(`<g filter="url(#k-rough)"><ellipse cx="520" cy="826" rx="10" ry="6" fill="#5A3C2A"/></g>`);
const DX0 = 36, DY0 = 116, DX1 = 1316, DY1 = 806;   // the map is painted in this design space, then fitted to the board
const boardD = `M${MX0 + 40} ${MY0}H${MX1 - 44}Q${MX1} ${MY0} ${MX1} ${MY0 + 46}V${MY1 - 40}Q${MX1} ${MY1} ${MX1 - 40} ${MY1}H${MX0 + 44}Q${MX0} ${MY1} ${MX0} ${MY1 - 44}V${MY0 + 40}Q${MX0} ${MY0} ${MX0 + 40} ${MY0}Z`;
s.push(`<path d="${boardD}" fill="${C.wisteria}" opacity="0.55" transform="translate(6 9)" filter="url(#k-soft)"/>`);
let map = '';
// hillside: deep green uphill to sunlit meadow down by the lane
map += `<linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E8A55"/><stop offset="0.45" stop-color="#7DAF62"/><stop offset="1" stop-color="#A9C77A"/></linearGradient><rect x="${DX0}" y="${DY0}" width="${DX1 - DX0}" height="${DY1 - DY0}" fill="url(#hillG)"/>`;
map += K.texture(DX0, DY0, DX1 - DX0, DY1 - DY0, 'mottle', 0.3) + K.texture(DX0, DY0, DX1 - DX0, DY1 - DY0, 'brush', 0.18);
// the sea and the shore road
map += K.sea({ x: DX0, y: 722, w: DX1 - DX0, h: 90, seed: 8 });
map += `<path d="M${DX0} 716Q300 704 620 718T${DX1} 712V736Q900 744 620 740T${DX0} 742Z" fill="#F1E2BE" filter="url(#k-rough)"/>`;
map += `<path d="M${DX0} 738Q300 746 620 744T${DX1} 736" stroke="#FFFDF4" stroke-width="5" fill="none" opacity="0.8" filter="url(#k-rough)"/>`;
// lanes: sandy paths winding up the hill
const lane = (d, w) => `<path d="${d}" fill="none" stroke="#8C7A63" stroke-width="${w + 8}" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#k-rough)"/><path d="${d}" fill="none" stroke="#E6D3AE" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" filter="url(#k-rough)"/><path d="${d}" fill="none" stroke="#FFF3D6" stroke-width="${w * 0.35}" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" filter="url(#k-rough)"/>`;
map += lane(`M${DX0 - 10} 690Q300 680 520 640Q680 610 760 560Q860 500 980 470Q1150 430 ${DX1 + 10} 420`, 38);           // the main Lane
map += lane('M520 640Q470 520 420 420Q380 330 470 250Q560 180 700 160', 26);                                          // up past the laundry yard
map += lane('M760 560Q770 450 820 380Q860 320 960 300', 22);                                                            // persimmon cut-through
map += lane('M980 470Q1050 560 1120 640Q1160 690 1200 716', 24);                                                        // down to the shore
map += lane('M300 690Q290 620 260 560', 18);
// stone steps on the steep bits
let steps = ''; for (let i = 0; i < 7; i++) { const t = i / 6, x = 430 - t * 30 + Math.sin(t * 3) * 6, y = 470 - t * 120; steps += `<rect x="${x - 16}" y="${y}" width="32" height="7" rx="2" fill="#CFC2A6"/><rect x="${x - 16}" y="${y + 6}" width="32" height="3" fill="#8C7A63" opacity="0.5"/>`; }
map += `<g filter="url(#k-rough)">${steps}</g>`;

// houses: little tiled roofs seen from above, with soft wisteria shadow to the lower right
const house = (x, y, w, h, col, rot) => {
  const q = [[x, y], [x + w, y], [x + w, y + h / 2], [x, y + h / 2]], q2 = [[x, y + h / 2], [x + w, y + h / 2], [x + w, y + h], [x, y + h]];
  return `<g transform="rotate(${rot || 0} ${x + w / 2} ${y + h / 2})">` + K.castShadow(`M${x + 8} ${y + 10}h${w}v${h}h${-w}Z`, 0.42) +
    `<g filter="url(#k-rough)"><rect x="${x + 4}" y="${y + h - 2}" width="${w - 8}" height="16" fill="#EFE0C2"/><rect x="${x + 4}" y="${y + h + 10}" width="${w - 8}" height="4" fill="#B98552"/>${Array.from({ length: Math.max(1, Math.floor(w / 46)) }, (_, i) => `<rect x="${x + 16 + i * 46}" y="${y + h + 1}" width="18" height="9" fill="${i % 2 ? '#FFD98A' : '#5E7F9A'}"/>`).join('')}</g>` +
    K.roof({ quad: [q[3], q[2], q[1], q[0]], rows: 3, cols: Math.round(w / 12), color: col || '#7E93A8' }) + K.roof({ quad: q2, rows: 3, cols: Math.round(w / 12), color: K.mix(col || '#7E93A8', '#3F4E66', 0.25) }) + `</g>`;
};
// trees: gouache clumps with a cast shadow
const tree = (x, y, r, seed, tones) => K.castShadow(`M${x - r * 0.7 + 14} ${y + 14}a${r * 0.85} ${r * 0.6} 0 1 0 ${r * 1.7} 0a${r * 0.85} ${r * 0.6} 0 1 0 ${-r * 1.7} 0Z`, 0.4) + K.foliage({ x, y, w: r * 2, h: r * 1.7, seed, tones });

/* DEN — Daifuku's great wall across the top of the hill, mossy, with the sea in sight */
map += tree(640, 150, 70, 3) + tree(1270, 160, 60, 5) + tree(760, 128, 50, 11);
map += house(880, 120, 150, 70, '#73879C', -2) + house(1080, 128, 110, 62, '#7E93A8', 3);
const denWall = 'M640 236Q800 222 980 226Q1140 230 1290 214';
map += `<path d="${denWall}" stroke="${C.wisteria}" stroke-width="40" fill="none" opacity="0.35" transform="translate(6 16)" filter="url(#k-soft)"/>`;
map += `<path d="${denWall}" stroke="#E7D7BC" stroke-width="34" fill="none" stroke-linecap="round" filter="url(#k-rough)"/><path d="${denWall}" stroke="#FBF6E6" stroke-width="12" fill="none" stroke-linecap="round" transform="translate(0 -9)" filter="url(#k-rough)"/>`;
map += `<g filter="url(#k-leaf-fine)" fill="#7FA35A"><ellipse cx="720" cy="236" rx="40" ry="12"/><ellipse cx="1060" cy="240" rx="56" ry="11"/><ellipse cx="1200" cy="226" rx="30" ry="10"/></g>`;
map += K.prop({ kind: 'bucket', x: 1032, y: 268, scale: 0.42 });

/* LAUNDRY POLE YARD — the yard with the lines of washing and the old gatepost */
map += house(70, 140, 170, 84, '#7E93A8', -3) + house(260, 130, 120, 70, '#8799AC', 2) + house(90, 300, 120, 72, '#74889E', 1);
map += `<path d="M230 360Q300 300 380 352Q350 430 270 430Q210 410 230 360Z" fill="#D9C79E" opacity="0.8" filter="url(#k-rough)"/>`;          // packed-earth yard
const laundry = (x1, y1, x2, y2, n, seed) => { const R = K.rng(seed); let l = `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#7A6A5C" stroke-width="3"/>`; for (let i = 0; i < n; i++) { const t = (i + 0.5) / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; const c = ['#FFFDF4', '#F7D9A8', '#BFD7EA', '#FFFDF4', '#E9C9D6'][Math.floor(R() * 5)]; l += K.castShadow(`M${x - 8 + 6} ${y + 6}h16v14h-16Z`, 0.35, 'soft') + `<rect x="${x - 9}" y="${y - 2}" width="18" height="${12 + R() * 8}" rx="2" fill="${c}" transform="rotate(${(R() - 0.5) * 10} ${x} ${y})"/>`; } return l; };
map += `<g filter="url(#k-rough)">${laundry(236, 250, 400, 238, 7, 3)}${laundry(236, 282, 410, 276, 6, 7)}</g>`;
map += tree(470, 390, 46, 17) + tree(150, 440, 52, 19);
/* PERSIMMON ALLEY — the cut-through under the persimmon tree */
map += house(560, 420, 120, 64, '#7E93A8', 4) + house(860, 600, 130, 66, '#73879C', -3) + house(640, 660, 110, 52, '#8799AC', 2);
map += tree(810, 470, 62, 23, { dark: '#3E7444', mid: '#5E9450', light: '#8DBB62', hi: '#BAD67A' });
map += `<g>${[[782, 452], [826, 444], [800, 486], [846, 476], [770, 494], [836, 506]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="#E0954A" stroke="#9A5A2E" stroke-width="1.5"/><circle cx="${x - 2}" cy="${y - 2}" r="2" fill="#FFE2B0"/>`).join('')}</g>`;
/* TOFU SHOP STEP — the shop with the striped awning and the milk crates */
map += house(1150, 470, 140, 80, '#6F8296', -2) + house(1010, 340, 120, 66, '#7E93A8', 3) + house(1200, 600, 100, 56, '#8799AC', -4);
map += `<g filter="url(#k-rough)">${[0, 1, 2, 3, 4, 5].map((i) => `<rect x="${1150 + i * 23}" y="550" width="23" height="18" fill="${i % 2 ? '#FFFDF4' : '#6E95C8'}"/>`).join('')}<rect x="1150" y="566" width="138" height="5" fill="${C.wisteria}" opacity="0.5"/></g>`;
map += tree(990, 640, 40, 29);
/* LOW WALL CORNER — Haru's house: the wooden roof, garden, low wall, red mailbox */
map += house(96, 556, 180, 96, '#6F8296', -2);
map += `<path d="M84 666Q190 676 296 664" stroke="#EADBC0" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#k-rough)"/>`; // Haru's low wall
map += K.flowers({ x: 132, y: 690, w: 80, h: 30, seed: 4, n: 3 }) + tree(320, 560, 36, 31);
map += `<g opacity="0.9">${K.glow(190, 600, 140, 70, '#FFD98A', 0.55)}</g>`;   // a lit window: someone is home

// set dressing: hedges along the lanes, flower beds, a vegetable plot, tall grass up the hill
{ const R = K.rng(404); const spots = [[150, 250], [420, 160], [520, 300], [690, 380], [930, 400], [1250, 400], [1290, 690], [880, 700], [560, 700], [440, 600], [180, 520], [60, 380], [1000, 560], [660, 560], [380, 260], [1150, 290]];
  spots.forEach(([x, y], i) => { map += tree(x, y, 18 + R() * 16, 60 + i, i % 3 ? null : { dark: '#2F6E4A', mid: '#4C8F4A', light: '#7DB857', hi: '#B5D873' }); });
  [[470, 214, '#7E8FD8'], [700, 330, '#E9C9D6'], [1050, 680, '#7E8FD8'], [600, 520, '#FFFDF4'], [210, 470, '#E9C9D6']].forEach(([x, y, c], i) => { map += K.flowers({ x, y, w: 56, h: 22, seed: 70 + i, n: 3, color: c }); });
  let rows = ''; for (let i = 0; i < 5; i++) rows += `<path d="M${380 + i * 4} ${616 + i * 12}h80" stroke="#5E9A4A" stroke-width="7" stroke-linecap="round"/>`;
  map += `<g filter="url(#k-rough)"><path d="M370 606h104v66h-104z" fill="#A8865E" opacity="0.7"/>${rows}</g>`;
  map += K.grass({ x1: 560, y1: 300, x2: 1300, y2: 312, n: 30, h: 14, seed: 3 }) + K.grass({ x1: 50, y1: 470, x2: 560, y2: 456, n: 20, h: 12, seed: 6 }); }
// warm dusk wash over the whole map + soft sun from the upper left
map += `<rect x="${DX0}" y="${DY0}" width="${DX1 - DX0}" height="${DY1 - DY0}" fill="#FFC27A" opacity="0.14" style="mix-blend-mode:multiply"/>` + K.glow(200, 140, 700, 420, '#FFE7B8', 0.35);

/* ---------- Patch territories: scent borders (gold = ours, sage = Wall Sitters) ---------- */
const PATCH = {
  DEN: [[560, 116], [1316, 116], [1316, 332], [1180, 352], [980, 322], [800, 332], [640, 300]],

  TSS: [[800, 332], [980, 322], [1180, 352], [1316, 332], [1316, 650], [1150, 668], [960, 606], [930, 472], [860, 410]],
  PA: [[620, 432], [760, 400], [800, 340], [860, 410], [930, 472], [960, 606], [820, 690], [620, 652], [560, 542]],
  LWC: [[36, 474], [300, 462], [480, 470], [620, 432], [560, 542], [620, 652], [560, 712], [36, 712]],
};
const smooth = (pts) => K.blob(pts, true, 0.25);
const terr = (pts, col, op, sel) => `<path d="${smooth(pts)}" fill="${col}" opacity="${op}" style="mix-blend-mode:${sel ? 'screen' : 'multiply'}"/>`;
['LPY', 'PA', 'LWC', 'TSS'].forEach((k) => { map += `<path d="${smooth(PATCH[k])}" fill="${C.gold}" opacity="${0.32}"/>`; });
map += `<path d="${smooth(PATCH.DEN)}" fill="#C9DCA0" opacity="0.55"/>`;
const border = (pts, col) => `<path d="${smooth(pts)}" fill="none" stroke="${C.cream}" stroke-width="10" stroke-linejoin="round" opacity="0.9"/><path d="${smooth(pts)}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linejoin="round"/>`;
['LPY', 'PA', 'LWC', 'TSS'].forEach((k) => { map += border(PATCH[k], C.gold); });
map += border(PATCH.DEN, '#7FA34A');

/* ---------- the landmarks (inked, a cat can mark them), drawn small for the stamps ---------- */
const post = {
  LWC: (x, y) => K.inked(`M${x - 4} ${y}V${y - 18}H${x + 4}V${y}Z`, '#6B5A50') + K.inked(`M${x - 12} ${y - 18}V${y - 40}Q${x} ${y - 50} ${x + 12} ${y - 40}V${y - 18}Z`, '#C8504A') + K.inkLine(`M${x - 7} ${y - 34}H${x + 7}`, 2),
  LPY: (x, y) => K.inked(`M${x - 8} ${y}V${y - 46}L${x} ${y - 52}L${x + 8} ${y - 46}V${y}Z`, '#B98654') + K.inkLine(`M${x - 3} ${y - 40}V${y - 8}`, 1.5),
  PA: (x, y) => K.inked(`M${x - 5} ${y}L${x - 3} ${y - 50}H${x + 3}L${x + 5} ${y}Z`, '#A69A8C') + K.inked(`M${x - 16} ${y - 44}H${x + 16}V${y - 39}H${x - 16}Z`, '#A69A8C') + K.inked(`M${x + 4} ${y - 34}h9v13h-9Z`, '#8996A4') + `<circle cx="${x - 12}" cy="${y - 50}" r="5" fill="#E0954A" stroke="${C.ink}" stroke-width="1.6"/>`,
  TSS: (x, y) => K.inked(`M${x - 18} ${y}V${y - 18}H${x + 2}V${y}Z`, '#E9B83E') + K.inked(`M${x + 2} ${y}V${y - 18}H${x + 20}V${y}Z`, '#6E95C8') + K.inked(`M${x - 9} ${y - 18}V${y - 36}H${x + 11}V${y - 18}Z`, '#E9B83E') + K.inkLine(`M${x - 18} ${y - 9}H${x + 20}M${x - 9} ${y - 27}H${x + 11}`, 1.4),
  DEN: (x, y) => K.inked(`M${x - 20} ${y}Q${x - 24} ${y - 22} ${x - 10} ${y - 30}Q${x + 6} ${y - 36} ${x + 18} ${y - 24}Q${x + 24} ${y - 8} ${x + 18} ${y}Z`, '#B9B5B0') + `<path d="M${x - 18} ${y - 22}Q${x - 2} ${y - 36} ${x + 16} ${y - 24}Q${x} ${y - 28} ${x - 18} ${y - 22}Z" fill="#8FB36A"/>`,
};
const landmark = (k, size) => `<svg viewBox="-28 -56 56 60" width="${size}" height="${size * 60 / 56}" style="display:block">${post[k](0, 0)}</svg>`;
const pom = (inner, size, bg) => `<svg viewBox="-22 -22 44 44" width="${size}" height="${size}" style="display:block;flex:none" overflow="visible"><circle r="20" fill="${bg || C.cream}" stroke="${C.ink}" stroke-width="3"/>${inner}</svg>`;
const st = `stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const BADGE = {
  moon: pom(`<path d="M5 -12A13 13 0 1 0 12 6A10 10 0 1 1 5 -12Z" fill="#EAF0FF" ${st}/>`, 44, C.ink),
  fading: pom(`<path d="M-4 12q-8 -6 0 -12q8 -6 0 -12" fill="none" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/><path d="M-4 12q-8 -6 0 -12q8 -6 0 -12" fill="none" stroke="${C.gold}" stroke-width="3.6" stroke-linecap="round"/><path d="M4 -10l6 6l-4 3l6 7" fill="none" ${st}/>`, 44),
  home: pom(`<path d="M-12 2L0 -10L12 2V12H-12Z" fill="${C.gold}" ${st}/><path d="M-3 12V5H3V12" fill="${C.cream}" ${st}/>`, 44),
};
const crownSvg = (size) => pom(`<path d="M-12 8L-13 -7L-6 -1L0 -11L6 -1L13 -7L12 8Z" fill="${C.gold}" ${st}/>`, size, C.sage);
const wisps = (n, col, size) => K.ui.wispRow({ n, color: col || C.gold, size: size || 26 });
const chip = (cat, name, ring, rib, size) => `<span class="chip">${K.ui.portrait({ cat, size: size || 56, ring })}<span class="k-ribbon k-ribbon--${rib}">${name}</span></span>`;

/* ---------- map: territory tint for the selected Patch, the neighbour link while carrying ---------- */
{ const sel = `<path d="${smooth(PATCH.PA)}" fill="none" stroke="#FFF0C8" stroke-width="26" stroke-linejoin="round" opacity="0.6" filter="url(#k-soft)"/><path d="${smooth(PATCH.PA)}" fill="none" stroke="${C.gold}" stroke-width="7" stroke-linejoin="round"/>`;
  map += sel; }
map += K.texture(36, 116, 1280, 690, 'grain', 0.22);
s.push(K.clipTo(boardD, `<g transform="translate(${MX0} ${MY0}) scale(${SX} ${SY}) translate(-36 -116)">${map}</g>`));
s.push(`<path d="${boardD}" fill="none" stroke="#5B3E2C" stroke-width="10"/><path d="${boardD}" fill="none" stroke="#E9C08A" stroke-width="3" transform="translate(0 -2)" opacity="0.7"/>`);

// Patch stamp positions (design space → board)
const SP_ = { DEN: [fx(1160), fy(214)], LPY: [fx(330), fy(330)], PA: [fx(760), fy(520)], TSS: [fx(1100), fy(470)], LWC: [fx(260), fy(600)] };
// neighbour link: carried Hige over Persimmon Alley ♥ Pon at Laundry Pole Yard (a mark, never a number)
{ const a = SP_.PA, b = SP_.LPY, m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 40];
  s.push(`<path d="M${a[0] - 60} ${a[1] - 30}Q${m[0]} ${m[1] - 20} ${b[0] + 60} ${b[1] + 10}" fill="none" stroke="${C.cream}" stroke-width="10" stroke-linecap="round"/><path d="M${a[0] - 60} ${a[1] - 30}Q${m[0]} ${m[1] - 20} ${b[0] + 60} ${b[1] + 10}" fill="none" stroke="${C.crimson}" stroke-width="5" stroke-dasharray="1 13" stroke-linecap="round"/>`); }
// brass tacks
[[MX0 + 24, MY0 + 24], [MX1 - 24, MY0 + 24], [MX0 + 24, MY1 - 24], [MX1 - 24, MY1 - 24]].forEach(([x, y]) => s.push(K.shadow({ x: x + 3, y: y + 4, rx: 10, ry: 6 }) + `<circle cx="${x}" cy="${y}" r="9" fill="${C.gold}" stroke="${C.ink}" stroke-width="2.5"/><circle cx="${x - 3}" cy="${y - 3}" r="3" fill="${C.cream}"/>`));

/* ================================ UI ================================ */
let ui = '';
const at = (x, y, html, style) => `<div class="k-abs" style="left:${x}px;top:${y}px;${style || ''}">${html}</div>`;

/* 1. HEADER: how am I doing? */
ui += `<div class="k-abs k-panel k-panel--sm hdr">
  <span class="k-h">Hidamari Lane</span>
  <div class="infl">${K.ui.icon({ name: 'bell', size: 40 })}<div class="bar"><i class="gold"></i><i class="fade"></i><i class="open"></i></div>${crownSvg(46)}<span class="pct">88%</span></div>
  <div class="tabs"><span class="k-btn k-key sh">L1</span><span class="tab">Crew</span><span class="tab on">Turf</span><span class="tab">Lessons</span><span class="tab">Share</span><span class="k-btn k-key sh">R1</span></div>
</div>`;

/* 2. MAP: where? — five stamps, no numbers, one badge each */
const stamp = (k, o) => { const [x, y] = SP_[k]; return `<div class="stamp ${o.cls || ''}" style="left:${x}px;top:${y}px"><div class="bean">${landmark(k, 46)}${wisps(o.w, o.col)}</div>${o.badge ? `<div class="badge">${BADGE[o.badge]}</div>` : ''}<div class="seat">${o.seat || '<div class="empty"></div>'}</div><span class="k-pill k-pill--cream pname">${o.name}</span></div>`; };
ui += stamp('DEN', { name: 'Den', w: 3, col: C.sage, cls: 'sage', seat: K.ui.portrait({ cat: { ...K.CAST.daifuku, scale: 0.86, y: 98 }, size: 62, ring: '#7FA34A' }) });
ui += stamp('LPY', { name: 'Laundry Pole Yard', w: 3, seat: K.ui.portrait({ cat: CREW.pon.cat, size: 62, ring: C.gold }) });
ui += stamp('TSS', { name: 'Tofu Shop Step', w: 2, badge: 'fading' });
ui += stamp('LWC', { name: 'Low Wall Corner', w: 4, badge: 'home' });
ui += stamp('PA', { name: 'Persimmon Alley', w: 2, badge: 'moon', cls: 'sel' });
// Hige, carried onto Persimmon Alley (lifted chip + the paw cursor)
ui += at(SP_.PA[0] + 70, SP_.PA[1] - 188, `<div style="transform:rotate(-8deg)">${K.ui.portrait({ cat: CREW.hige.cat, size: 96, ring: C.gold })}</div>`);
ui += at(SP_.PA[0] + 146, SP_.PA[1] - 112, K.ui.paw({ size: 48, fill: C.gold }), 'transform:rotate(-20deg)');
ui += at((SP_.PA[0] + SP_.LPY[0]) / 2 - 26, (SP_.PA[1] + SP_.LPY[1]) / 2 - 76, pom(`<path d="M0 12Q-16 0 -13 -8Q-10 -15 0 -6Q10 -15 13 -8Q16 0 0 12Z" fill="${C.crimson}" ${st}/>`, 52));

/* 3. TONIGHT: what do I do? */
ui += `<div class="k-abs k-panel ton">
  <div class="row" style="gap:14px">${BADGE.moon}<span class="k-h">Tonight</span></div>
  <div class="row" style="gap:12px">${landmark('PA', 40)}<span class="em">Persimmon Alley</span></div>
  <div class="row"><span class="lab">Raid</span>${chip(TOGE, 'Togemaru', '#7FA34A', 'sage', 56)}<span class="em" style="color:var(--cocoa)">+</span>${K.ui.portrait({ cat: { coat: 'grey', pattern: 'tabby', ears: 'standard', eye: 'amber', expr: 'neutral' }, size: 56, ring: C.cocoa })}<span class="k-pill k-pill--cream" style="height:36px;font-size:28px;padding:0 12px">?</span></div>
  <div class="row"><span class="lab">Scent</span><span class="em">48</span><span style="color:var(--cocoa)">· Strong at 60</span></div>
  <div class="row"><span class="lab">Tribute</span>${K.ui.icon({ name: 'fish', size: 34 })}<span class="em">11</span><span style="color:var(--cocoa)">tomorrow</span></div>
  <div class="rule"></div>
  <div class="row"><span class="lab">Carrying</span>${chip(CREW.hige.cat, 'Hige', C.gold, 'gold', 56)}<span class="k-pill k-pill--cream" style="height:36px;font-size:28px;padding:0 12px">${pIcon('Stalwart', 28)}&nbsp;True</span></div>
  <div class="odds"><i class="r"></i><i class="s"></i><i class="l"></i></div>
  <div class="oddlab"><span>Repelled</span><span>Scuffed</span><span>Lost</span></div>
  <div class="row">${pIcon('Stalwart', 34)}<span>Holds like a wall.</span></div>
  <div class="row">${pom(`<path d="M0 12Q-16 0 -13 -8Q-10 -15 0 -6Q10 -15 13 -8Q16 0 0 12Z" fill="${C.crimson}" ${st}/>`, 34)}<span>Pon next door</span></div>
  <span class="k-btn k-btn--confirm go">${K.ui.faceButtons({ size: 46, lit: 's' })}Post Hige</span>
</div>`;

/* 4. CREW STRIP: who? */
const catChip = (c, tier, pill, cls) => `<div class="cat ${cls || ''}">${K.ui.portrait({ cat: c.cat, size: 84, ring: C.gold })}<div class="tx"><span class="row" style="gap:6px"><span class="k-ribbon k-ribbon--gold">${c.name}</span>${pIcon(c.pers, 32)}</span><span class="row" style="font-weight:700;color:var(--cocoa)">${tier}</span>${pill}</div></div>`;
const peg = (filled) => `<svg width="30" height="42" viewBox="0 0 30 42"><path d="M7 2h16v26q0 10 -8 12q-8 -2 -8 -12z" fill="${filled ? C.gold : C.recessed}" stroke="${C.ink}" stroke-width="2.6"/><path d="M15 4v34" stroke="${C.ink}" stroke-width="2"/></svg>`;
ui += `<div class="k-abs k-panel strip">
  <div class="pegs"><span class="k-small">Sentries</span><div style="display:flex;gap:10px">${peg(true)}${peg(false)}</div></div>
  <div class="div"></div>
  ${catChip(CREW.hige, 'True', '<span class="k-pill k-pill--gold">carrying</span>', 'carry')}
  ${catChip(CREW.pon, 'Steady', '<span class="k-pill">Laundry Pole</span>')}
  ${catChip(CREW.kinako, 'Steady', '<span class="k-pill k-pill--cream">Posse</span>')}
  ${catChip(CREW.kagi, 'Aloof', '<span class="k-pill k-pill--cream">Posse</span>')}
  <div class="div"></div>
  <div class="tot"><div class="row"><span class="lab" style="width:auto">Tomorrow</span>${K.ui.icon({ name: 'fish', size: 32 })}<span class="em">42 − 4 = 38</span></div><div class="row"><span class="lab" style="width:auto">Stash</span>${K.ui.icon({ name: 'fish', size: 32 })}<span class="em">128</span></div></div>
</div>`;

/* shared control footer */
const fb = (l) => K.ui.faceButtons({ size: 42, lit: l });
ui += `<div class="k-abs foot"><span class="k-prompt">${fb('s')}Pick up / post</span><span class="k-prompt">${fb('n')}Cat card</span><span class="k-prompt">${fb('w')}Unpost</span><span class="k-prompt"><span class="k-btn k-key" style="height:42px;min-width:60px;font-size:22px">View</span>Legend</span><span class="k-prompt">${fb('e')}Leave</span></div>`;

document.getElementById('stage').innerHTML = K.svg(W, H, s.join(''), 'class="k-world"') + ui;
</script>
